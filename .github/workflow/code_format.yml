name: Auto Format Code

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5.4.0
      with:
        python-version: "3.13"
        architecture: "x64"
    - name: install packages
      run: pip install black autopep8 isort
    - name: Auto format code
      run: |
        black .
        autopep8 --recursive --in-place --aggressive --aggressive .
        isort .
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7.0.6
      with:
        commit-message: Auto Code Format
        title: (Review) Automatic Code Format by GitHub Action
        body: Auto-Generated Pull Request 
        reviewers: "Saad Rahim (AMD) <44449863+saadrahim@users.noreply.github.com>"
        maintainer-can-modify: true
        labels: Backend
        branch: python-code-format
