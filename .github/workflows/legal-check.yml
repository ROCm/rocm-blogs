name: Legal Review Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

jobs:
  legal-review-check:
    name: Verify Legal Review Completion
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'Blog Creation')
    
    steps:
      - name: Check Legal Review Checkboxes
        uses: actions/github-script@v9
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            
            // Find the Legal Review section (matches the prominent header)
            const legalSectionRegex = /## LEGAL REVIEW.*?\s*([\s\S]*?)(?=---|###|$)/;
            const legalMatch = prBody.match(legalSectionRegex);
            
            if (!legalMatch) {
              core.setFailed('❌ Legal Review section not found in PR body. Please ensure the PR was created using the blog creation workflow.');
              return;
            }
            
            const legalSection = legalMatch[1];
            
            // Find all checkboxes in the Legal Review section
            const checkboxRegex = /- \[([ xX])\] \*\*([^*]+)\*\*/g;
            const checkboxes = [];
            let match;
            
            while ((match = checkboxRegex.exec(legalSection)) !== null) {
              checkboxes.push({
                checked: match[1].toLowerCase() === 'x',
                label: match[2].trim()
              });
            }
            
            if (checkboxes.length === 0) {
              core.setFailed('❌ No Legal Review checkboxes found. Please ensure the PR body contains the Legal Review section with checkboxes.');
              return;
            }
            
            // Check for unchecked items
            const unchecked = checkboxes.filter(cb => !cb.checked);
            
            if (unchecked.length > 0) {
              const uncheckedList = unchecked.map(cb => `  • ${cb.label}`).join('\n');
              core.setFailed(`❌ Legal Review incomplete. The following items must be checked before merging:\n\n${uncheckedList}\n\nPlease complete all legal review items in the PR description.`);
              return;
            }
            
            console.log('✅ All Legal Review checkboxes are complete!');
            console.log(`Verified ${checkboxes.length} legal review item(s):`);
            checkboxes.forEach(cb => {
              console.log(`  ✓ ${cb.label}`);
            });
