name: Docs Linting

on:
  push:
    branches: [develop, main, spelling]
  pull_request:
    branches: [develop, main, spelling]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint-md:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@v46.0.1
        with:
          files: |
            **/*.md

      - name: Check number of changed files
        id: check-count
        if: steps.changed-md.outputs.any_changed == 'true'
        run: |
          COUNT=$(echo "${{ steps.changed-md.outputs.all_changed_files }}" | wc -w)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 50 ]; then
            echo "too_many=true" >> $GITHUB_OUTPUT
          else
            echo "too_many=false" >> $GITHUB_OUTPUT
          fi

      - name: Run markdownlint on changed files
        if: steps.changed-md.outputs.any_changed == 'true' && steps.check-count.outputs.too_many == 'false'
        uses: DavidAnson/markdownlint-cli2-action@v10.0.1
        with:
          config: .markdownlint.yaml
          globs: ${{ steps.changed-md.outputs.all_changed_files }}

      - name: Run markdownlint on all blog files (many changes)
        if: steps.changed-md.outputs.any_changed == 'true' && steps.check-count.outputs.too_many == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v10.0.1
        with:
          config: .markdownlint.yaml
          globs: "blogs/**/*.md"

  spelling:
    name: Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed markdown files
        id: changed-md
        uses: tj-actions/changed-files@v46.0.1
        with:
          files: |
            **/*.md

      - name: Check for local overrides
        id: check_local_spelling
        run: |
          if [ -f .spellcheck.local.yaml ]; then
            echo "check_result=true" >> $GITHUB_OUTPUT
          else
            echo "check_result=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge local and main YAML files
        if: steps.check_local_spelling.outputs.check_result == 'true'
        run: |
          python3 .github/workflows/yaml_merger.py .spellcheck.yaml .spellcheck.local.yaml .spellcheck.yaml

      - name: Run spellcheck
        if: steps.changed-md.outputs.any_changed == 'true'
        uses: rojopolis/spellcheck-github-actions@0.46.0
        with:
          task_name: Markdown
          source_files: ${{ steps.changed-md.outputs.all_changed_files }}

      - name: On fail
        if: failure()
        run: |
          echo "Please check for spelling mistakes or add them to '.wordlist.txt'."
