<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">The xDiT distributed diffusion inference pipeline</title><desc id="desc">Model weights load and are placed on GPUs once. A prompt passes through a text encoder, then a repeated diffusion transformer loop shares token work across GPUs before a VAE decoder produces an image or video.</desc>
  <defs><style>text{font-family:"Open Sans",Arial,sans-serif}.title{font-family:Klavika,"Open Sans",Arial,sans-serif;font-weight:700;font-size:40px;fill:#fff}.label{font:700 14px Consolas,monospace;fill:#2899ff}.box-title{font-family:Klavika,"Open Sans",Arial,sans-serif;font-size:24px;font-weight:700;fill:#fff}.copy{font-size:16px;fill:#c8d1d7}.step{font-size:13px;font-weight:700;fill:#fff}.rule{stroke:#61737e;stroke-width:2;fill:none}.accent{stroke:#2899ff;stroke-width:4;fill:none}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2899ff"/></marker></defs>
  <rect width="1600" height="700" fill="#050505"/><path d="M1335 0h265v240z" fill="#2899ff" opacity=".08"/><text x="70" y="80" class="label">XDIT INFERENCE PIPELINE</text><text x="70" y="132" class="title">Load once, denoise repeatedly, then decode</text><line x1="70" y1="160" x2="1530" y2="160" stroke="#46545c"/>
  <g transform="translate(70 294)"><rect width="230" height="150" fill="#121212" stroke="#64747d"/><rect width="230" height="8" fill="#2899ff"/><text x="24" y="48" class="label">ONCE</text><text x="24" y="88" class="box-title">Text encoder</text><text x="24" y="116" class="copy">Turn the prompt into</text><text x="24" y="138" class="copy">conditioning.</text></g>
  <path d="M300 369h82" class="accent" marker-end="url(#arrow)"/>
  <g transform="translate(410 210)"><rect width="670" height="315" fill="#121212" stroke="#64747d" stroke-width="2"/><rect width="670" height="8" fill="#2899ff"/><text x="28" y="52" class="label">EVERY DENOISING STEP</text><text x="28" y="92" class="box-title">Iterate over the diffusion transformer</text><g transform="translate(28 125)"><rect width="175" height="106" fill="#1b2b35" stroke="#416174"/><text x="18" y="35" class="step">1. SPLIT TOKENS</text><text x="18" y="62" class="copy">Share image tokens</text><text x="18" y="84" class="copy">across GPUs.</text></g><g transform="translate(246 125)"><rect width="175" height="106" fill="#1b2b35" stroke="#416174"/><text x="18" y="35" class="step">2. TRANSFORM</text><text x="18" y="62" class="copy">Each GPU refines</text><text x="18" y="84" class="copy">its token share.</text></g><g transform="translate(464 125)"><rect width="175" height="106" fill="#1b2b35" stroke="#416174"/><text x="18" y="35" class="step">3. COMBINE</text><text x="18" y="62" class="copy">Combine results, then</text><text x="18" y="84" class="copy">advance to the next step.</text></g><path d="M203 178h43M421 178h43" class="accent" marker-end="url(#arrow)"/><path d="M620 260H85" class="rule" marker-end="url(#arrow)"/><text x="257" y="285" class="label">REPEAT UNTIL COMPLETE</text></g>
  <path d="M1080 355h82" class="accent" marker-end="url(#arrow)"/>
  <g transform="translate(1190 260)"><rect width="300" height="190" fill="#121212" stroke="#64747d"/><rect width="300" height="8" fill="#2899ff"/><text x="24" y="53" class="label">FINAL</text><text x="24" y="94" class="box-title">VAE decode</text><text x="24" y="122" class="copy">Turns the latent into</text><text x="24" y="145" class="copy">an image or video.</text></g>
  <g transform="translate(410 548)"><rect width="670" height="48" fill="#1b2b35" stroke="#416174"/><rect width="8" height="48" fill="#2899ff"/><text x="28" y="22" class="label">LOAD MODEL</text><text x="160" y="22" class="copy">Place model weights on the GPUs before denoising begins.</text></g>
  <text x="70" y="646" class="copy">Model loading, transformer execution, and VAE decode each offer opportunities to use multiple GPUs more effectively.</text>
</svg>
