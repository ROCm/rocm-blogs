<text x="40.0" y="44.0" class="eyebrow" text-anchor="start">MULTI-GPU DIFFUSION INFERENCE</text>
<text x="40.0" y="84.0" class="title klav" text-anchor="start">Pick the GPU count your workload benefits from</text>
<text x="40.0" y="112.0" class="sub" text-anchor="start">End-to-end latency for one image or video, with the model already loaded.</text>
<text x="40.0" y="138.0" class="caveat" text-anchor="start">Results depend on CPU performance, host memory bandwidth, PCIe topology, NUMA placement and driver versions,</text>
<text x="40.0" y="157.0" class="caveat" text-anchor="start">so expect variation between systems, most of all for multi-GPU runs and runs that offload to system memory.</text>
