<text x="40.0" y="850.0" class="note" text-anchor="start">All runs use torch.compile, FP8 GEMMs and FP8 attention (SD3.5: BF16 GEMMs), plus step caching except on the 4-step models.</text>
<text x="40.0" y="873.0" class="note" text-anchor="start">* Doesn't fit on one 32GB GPU: the 1-GPU run offloads to system memory, so the speedup is larger.</text>
<text x="40.0" y="896.0" class="note" text-anchor="start">CFG: prompt and no-prompt passes on separate GPUs. Ulysses: each GPU takes part of the image. PipeFusion: each GPU holds part of the model.</text>
<text x="40.0" y="919.0" class="note" text-anchor="start">Multi-GPU runs also split the VAE decode across GPUs (except SD3.5 on 4 GPUs).</text>
<text x="40.0" y="942.0" class="note" text-anchor="start">Radeon AI PRO R9700S · ROCm 10.0 · xDiT · median of 5 runs · no direct GPU link; transfers go over PCIe via system memory.</text>
</svg>