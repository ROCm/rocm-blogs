<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
<title id="title">MiniMax-M3 indexer context parallelism</title><desc id="desc">For requests beyond 288 index blocks, four TP ranks each score an interleaved share of the key blocks for all four index heads, reusing key data across heads and query rows. For each head, eight partitions contribute 16 candidates each to its owning rank.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1280" height="710" rx="18" fill="#f8fafc"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033">
<text x="40" y="48" font-size="26" font-weight="700" fill="#172033" text-anchor="start">MiniMax-M3: partition the long-context indexer across TP4</text>
<text x="40" y="82" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">CP activates past 288 index blocks (about 36K tokens); short requests keep TP index scoring.</text>
<text x="40" y="125" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Reuse each key-block load across four heads and the query rows</text>
<rect x="40" y="148" width="270" height="125" rx="10" fill="white" stroke="#145d80" stroke-width="2"/>
<text x="60" y="181" font-size="21" font-weight="700" fill="#145d80" text-anchor="start">TP rank 0</text>
<text x="60" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Key blocks: index % 4 = 0</text>
<text x="60" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score heads 0, 1, 2, 3</text>
<path d="M175 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="327" width="270" height="100" rx="10" fill="white" stroke="#145d80" stroke-width="2"/>
<text x="175" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">For one index head</text>
<text x="175" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">2 partitions × top-16</text>
<path d="M175 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="148" width="270" height="125" rx="10" fill="white" stroke="#237f81" stroke-width="2"/>
<text x="370" y="181" font-size="21" font-weight="700" fill="#237f81" text-anchor="start">TP rank 1</text>
<text x="370" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Key blocks: index % 4 = 1</text>
<text x="370" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score heads 0, 1, 2, 3</text>
<path d="M485 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="327" width="270" height="100" rx="10" fill="white" stroke="#237f81" stroke-width="2"/>
<text x="485" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">For one index head</text>
<text x="485" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">2 partitions × top-16</text>
<path d="M485 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="148" width="270" height="125" rx="10" fill="white" stroke="#a34f40" stroke-width="2"/>
<text x="680" y="181" font-size="21" font-weight="700" fill="#a34f40" text-anchor="start">TP rank 2</text>
<text x="680" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Key blocks: index % 4 = 2</text>
<text x="680" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score heads 0, 1, 2, 3</text>
<path d="M795 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="327" width="270" height="100" rx="10" fill="white" stroke="#a34f40" stroke-width="2"/>
<text x="795" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">For one index head</text>
<text x="795" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">2 partitions × top-16</text>
<path d="M795 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="970" y="148" width="270" height="125" rx="10" fill="white" stroke="#8567a8" stroke-width="2"/>
<text x="990" y="181" font-size="21" font-weight="700" fill="#8567a8" text-anchor="start">TP rank 3</text>
<text x="990" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Key blocks: index % 4 = 3</text>
<text x="990" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score heads 0, 1, 2, 3</text>
<path d="M1105 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="970" y="327" width="270" height="100" rx="10" fill="white" stroke="#8567a8" stroke-width="2"/>
<text x="1105" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">For one index head</text>
<text x="1105" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">2 partitions × top-16</text>
<path d="M1105 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="496" width="860" height="100" rx="10" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
<text x="640" y="532" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Head’s owning TP rank: merge 128 candidates → select 16 blocks</text>
<text x="640" y="567" font-size="17" font-weight="400" fill="#172033" text-anchor="middle">4 ranks × 2 partitions × 16 candidates; repeat for each of the four heads</text>
<text x="40" y="641" font-size="17" font-weight="500" fill="#172033" text-anchor="start">Selection matches the TP path bit for bit in the checks reported by ATOM PR #2419.</text>
<text x="40" y="681" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Source: ATOM PR #2419 and its pinned M3 source. Candidate exchange shown for one head.</text>
</g></svg>
