<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
<title id="title">MiniMax-M3 indexer context parallelism</title><desc id="desc">Four TP ranks score different parts of the cache, then exchange candidates to select the final keys for each index head.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b" /></marker></defs>
<rect width="1280" height="710" rx="18" fill="#f8fafc" />
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033">
<text x="40" y="48" font-size="26" font-weight="700" fill="#172033" text-anchor="start">FlyDSL indexer CP: split M3’s long-context scan across TP4</text>
<text x="40" y="82" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Split the long-context cache across four GPUs.</text>
<text x="40" y="125" font-size="20" font-weight="700" fill="#172033" text-anchor="start">Score different parts of the cache in parallel</text>
<rect x="40" y="148" width="270" height="125" rx="10" fill="white" stroke="#145d80" stroke-width="2" />
<text x="60" y="181" font-size="21" font-weight="700" fill="#145d80" text-anchor="start">TP rank 0</text>
<text x="60" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score one part of the cache</text>
<text x="60" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score all index heads</text>
<path d="M175 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="327" width="270" height="100" rx="10" fill="white" stroke="#145d80" stroke-width="2" />
<text x="175" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Local candidates</text>
<text x="175" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">Keep top candidates</text>
<path d="M175 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="350" y="148" width="270" height="125" rx="10" fill="white" stroke="#237f81" stroke-width="2" />
<text x="370" y="181" font-size="21" font-weight="700" fill="#237f81" text-anchor="start">TP rank 1</text>
<text x="370" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score one part of the cache</text>
<text x="370" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score all index heads</text>
<path d="M485 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="350" y="327" width="270" height="100" rx="10" fill="white" stroke="#237f81" stroke-width="2" />
<text x="485" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Local candidates</text>
<text x="485" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">Keep top candidates</text>
<path d="M485 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="660" y="148" width="270" height="125" rx="10" fill="white" stroke="#a34f40" stroke-width="2" />
<text x="680" y="181" font-size="21" font-weight="700" fill="#a34f40" text-anchor="start">TP rank 2</text>
<text x="680" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score one part of the cache</text>
<text x="680" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score all index heads</text>
<path d="M795 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="660" y="327" width="270" height="100" rx="10" fill="white" stroke="#a34f40" stroke-width="2" />
<text x="795" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Local candidates</text>
<text x="795" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">Keep top candidates</text>
<path d="M795 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="970" y="148" width="270" height="125" rx="10" fill="white" stroke="#8567a8" stroke-width="2" />
<text x="990" y="181" font-size="21" font-weight="700" fill="#8567a8" text-anchor="start">TP rank 3</text>
<text x="990" y="212" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score one part of the cache</text>
<text x="990" y="242" font-size="17" font-weight="400" fill="#172033" text-anchor="start">Score all index heads</text>
<path d="M1105 279 V319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="970" y="327" width="270" height="100" rx="10" fill="white" stroke="#8567a8" stroke-width="2" />
<text x="1105" y="359" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">Local candidates</text>
<text x="1105" y="390" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">Keep top candidates</text>
<path d="M1105 433 V467 H640 V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="210" y="496" width="860" height="100" rx="10" fill="#fff5f4" stroke="#e34b48" stroke-width="2" />
<text x="640" y="532" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Combine candidates to select the final keys</text>
<text x="640" y="567" font-size="17" font-weight="400" fill="#172033" text-anchor="middle">Repeat for each index head</text>
<text x="40" y="641" font-size="17" font-weight="500" fill="#172033" text-anchor="start">Produces the same selection as the separate scoring path in the reported checks.</text>
<text x="40" y="681" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Based on ATOM’s M3 indexer. Candidate exchange is shown for one head.</text>
</g></svg>
