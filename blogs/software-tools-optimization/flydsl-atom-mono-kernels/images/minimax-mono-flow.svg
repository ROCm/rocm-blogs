<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
<title id="title">MiniMax-M3: one sparse layer, one FlyDSL launch per TP rank</title><desc id="desc">Six groups of sparse-layer stages run inside a resident grid of 256 workgroups, from normalization and index projections through sparse attention and expert reduction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1280" height="680" rx="18" fill="#f8fafc"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033">
<text x="40" y="48" font-size="27" font-weight="700" fill="#172033" text-anchor="start">MiniMax-M3: one sparse layer, one launch per TP rank</text>
<text x="40" y="82" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">MI355X · TP4 · 1–16 token rows · first three dense layers use ATOM's separate kernels</text>
<rect x="28" y="111" width="1224" height="416" rx="10" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
<text x="50" y="148" font-size="21" font-weight="700" fill="#172033" text-anchor="start">Resident grid: 256 workgroups × 512 threads</text>
<text x="50" y="176" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">M3's schedule assigns workgroups their tasks; consumers wait for the inputs they need.</text>
<rect x="50" y="205" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="66" y="236" font-size="18" font-weight="700" fill="#172033" text-anchor="start">1  Prepare queries and caches</text>
<text x="66" y="268" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Input norm + Q/K/V/index projections</text>
<text x="66" y="294" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Head norm + RoPE + cache insertion</text>
<rect x="465" y="205" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="481" y="236" font-size="18" font-weight="700" fill="#172033" text-anchor="start">2  Find the sparse keys</text>
<text x="481" y="268" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Index-block scoring + selection</text>
<text x="481" y="294" font-size="15" font-weight="400" fill="#172033" text-anchor="start">16 blocks × 128 tokens</text>
<rect x="880" y="205" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="896" y="236" font-size="18" font-weight="700" fill="#172033" text-anchor="start">3  Compute attention</text>
<text x="896" y="268" font-size="15" font-weight="400" fill="#172033" text-anchor="start">8 partitions × 256 selected keys</text>
<text x="896" y="294" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Merge partitions + output projection</text>
<rect x="880" y="371" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="896" y="402" font-size="18" font-weight="700" fill="#172033" text-anchor="start">4  Reduce and route</text>
<text x="896" y="434" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Attention AllReduce + residual</text>
<text x="896" y="460" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Normalization + router</text>
<rect x="465" y="371" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="481" y="402" font-size="18" font-weight="700" fill="#172033" text-anchor="start">5  Compute the experts</text>
<text x="481" y="434" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Shared expert + top-4 routed experts</text>
<text x="481" y="460" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Up/gate → activation → down</text>
<rect x="50" y="371" width="350" height="115" rx="10" fill="white" stroke="#efaaa8" stroke-width="2"/>
<text x="66" y="402" font-size="18" font-weight="700" fill="#172033" text-anchor="start">6  Complete the layer</text>
<text x="66" y="434" font-size="15" font-weight="400" fill="#172033" text-anchor="start">MoE AllReduce</text>
<text x="66" y="460" font-size="15" font-weight="400" fill="#172033" text-anchor="start">Prepare the next layer’s inputs</text>
<path d="M405 262 H458" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M820 262 H873" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1055 326 V364" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M873 428 H820" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M458 428 H405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="1200" height="71" rx="10" fill="#172033" stroke="#172033" stroke-width="2"/>
<text x="640" y="580" font-size="18" font-weight="500" fill="white" text-anchor="middle">Tagged payloads in local and peer memory · LDS reused across stages</text>
<text x="640" y="605" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="middle">Row-count specialization changes task placement, expert grouping, and AllReduce strategy.</text>
<text x="40" y="652" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Source: ATOM PR #2419 and its pinned M3 source. Dependency schematic; no timing is implied.</text>
</g></svg>
