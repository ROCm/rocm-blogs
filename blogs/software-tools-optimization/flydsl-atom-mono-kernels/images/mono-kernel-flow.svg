<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="635" viewBox="0 0 1280 635" role="img" aria-labelledby="title desc">
<title id="title">From separate operator launches to a resident mono-kernel layer</title>
<desc id="desc">Separate launches for projections, attention, reductions, routing, and experts are coordinated in one resident grid. Stage tasks exchange tagged data through local and peer memory.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="635" rx="18" fill="#f8fafc"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033">
<text x="42" y="48" font-size="28" font-weight="700">A programmable decode-layer schedule</text>
<text x="42" y="80" font-size="17" fill="#64748b">FlyDSL expresses compute, data movement, and synchronization in the same device program.</text>
<text x="42" y="128" font-size="18" font-weight="700">Separate operator launches</text>
<rect x="42" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="132" y="178" text-anchor="middle" font-size="16">Norm +</text><text x="132" y="201" text-anchor="middle" font-size="16">projections</text><path d="M226 185 H240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="244" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="334" y="178" text-anchor="middle" font-size="16">Indexer +</text><text x="334" y="201" text-anchor="middle" font-size="16">attention</text><path d="M428 185 H442" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="446" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="536" y="178" text-anchor="middle" font-size="16">Output +</text><text x="536" y="201" text-anchor="middle" font-size="16">TP reduction</text><path d="M630 185 H644" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="648" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="738" y="178" text-anchor="middle" font-size="16">Norm +</text><text x="738" y="201" text-anchor="middle" font-size="16">router</text><path d="M832 185 H846" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="850" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="940" y="178" text-anchor="middle" font-size="16">Shared +</text><text x="940" y="201" text-anchor="middle" font-size="16">routed experts</text><path d="M1034 185 H1048" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1052" y="148" width="180" height="73" rx="9" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="1142" y="178" text-anchor="middle" font-size="16">TP reduction</text><text x="1142" y="201" text-anchor="middle" font-size="16">+ residual</text><text x="42" y="250" font-size="15" fill="#64748b">Operator boundaries carry launches, intermediate storage, and dependency ordering.</text>
<rect x="28" y="288" width="1218" height="272" rx="14" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
<text x="48" y="324" font-size="20" font-weight="700">One mono-kernel launch per layer and TP rank</text>
<text x="48" y="351" font-size="15" fill="#64748b">GLM example: 256 resident workgroups × 512 threads · stage-specific tasks · specialized geometry</text>
<rect x="42" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="132" y="402" text-anchor="middle" font-size="16">Norm +</text><text x="132" y="425" text-anchor="middle" font-size="16">projections</text><path d="M132 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="244" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="334" y="402" text-anchor="middle" font-size="16">Indexer +</text><text x="334" y="425" text-anchor="middle" font-size="16">attention</text><path d="M334 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="446" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="536" y="402" text-anchor="middle" font-size="16">Output +</text><text x="536" y="425" text-anchor="middle" font-size="16">TP reduction</text><path d="M536 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="648" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="738" y="402" text-anchor="middle" font-size="16">Norm +</text><text x="738" y="425" text-anchor="middle" font-size="16">router</text><path d="M738 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="850" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="940" y="402" text-anchor="middle" font-size="16">Shared +</text><text x="940" y="425" text-anchor="middle" font-size="16">routed experts</text><path d="M940 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="1052" y="374" width="180" height="68" rx="9" fill="white" stroke="#efaaa8" stroke-width="1.5"/><text x="1142" y="402" text-anchor="middle" font-size="16">TP reduction</text><text x="1142" y="425" text-anchor="middle" font-size="16">+ residual</text><path d="M1142 444 V470" stroke="#e34b48" stroke-width="1.5"/><rect x="48" y="471" width="1178" height="63" rx="9" fill="#172033"/>
<text x="637" y="498" text-anchor="middle" fill="white" font-size="16">Tagged handoffs in local and peer memory · LDS reused across non-overlapping stages</text>
<text x="637" y="520" text-anchor="middle" fill="#cbd5e1" font-size="14">Consumers wait for their inputs; independent memory work can start earlier.</text>
<text x="42" y="603" font-size="15" fill="#64748b">Schematic grouping. One launch covers a supported layer; a model forward still spans multiple layers.</text>
</g></svg>