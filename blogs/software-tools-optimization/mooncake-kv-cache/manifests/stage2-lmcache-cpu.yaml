# Stage 2: LMCache CPU Offloading
#
# Diff from Stage 1:
#   + kv-transfer-config flag on vllm serve
#   + PYTHONHASHSEED=0 and LMCACHE_* env vars
#   + Increased memory limits (256 GB CPU cache pool)
#
# DeepSeek-V3.2 (671B MoE, FP8) on 8×MI300X per node
# LMCache adds 256 GB CPU DRAM as L2 KV cache tier
#
# Apply:  kubectl apply -f stage2-lmcache-cpu.yaml
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: vllm-serving

---
# ---------------------------------------------------------------------------
# RBAC (identical to Stage 1)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-router
  namespace: vllm-serving

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-router
  namespace: vllm-serving
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-router
  namespace: vllm-serving
subjects:
  - kind: ServiceAccount
    name: vllm-router
    namespace: vllm-serving
roleRef:
  kind: Role
  name: vllm-router
  apiGroup: rbac.authorization.k8s.io

---
# ---------------------------------------------------------------------------
# Router Service + Pod (identical to Stage 1)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: vllm-serving
spec:
  type: NodePort
  selector:
    app: vllm-router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: v1
kind: Pod
metadata:
  name: router
  namespace: vllm-serving
  labels:
    app: vllm-router
spec:
  serviceAccountName: vllm-router
  restartPolicy: Always
  containers:
    - name: router
      image: vllm/vllm-router:latest
      command:
        - vllm-router
        - --host=0.0.0.0
        - --port=8080
        - --service-discovery
        - --selector
        - app=vllm-worker
        - --service-discovery-namespace=vllm-serving
        - --service-discovery-port=8000
        - --policy=consistent_hash
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10

---
# ===========================================================================
# Shared environment — AMD + LMCache CPU offloading
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-env
  namespace: vllm-serving
data:
  # AMD ROCm optimizations
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MLA: "1"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
  NCCL_MIN_NCHANNELS: "112"
  # LMCache — MANDATORY for cache key consistency across TP workers
  PYTHONHASHSEED: "0"
  # LMCache CPU offloading
  LMCACHE_LOCAL_CPU: "True"
  LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
  LMCACHE_CHUNK_SIZE: "256"
  LMCACHE_REMOTE_SERDE: "naive"
  LMCACHE_NUMA_MODE: "auto"

---
# ===========================================================================
# vLLM Worker — Node 1 (8×MI300X, TP=8, LMCache CPU offload)
# ===========================================================================
apiVersion: v1
kind: Pod
metadata:
  name: vllm-node1
  namespace: vllm-serving
  labels:
    app: vllm-worker
spec:
  hostNetwork: true
  hostIPC: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: gpu-node-1  # UPDATE: your first GPU node hostname
  containers:
    - name: vllm
      image: vllm/vllm-openai-rocm:nightly
      securityContext:
        privileged: true
      command: ["sh", "-c"]
      args:
        - exec vllm serve deepseek-ai/DeepSeek-V3.2
            --tensor-parallel-size 8
            --enable-prefix-caching
            --enable-expert-parallel
            --async-scheduling
            --max-model-len 65536
            --gpu-memory-utilization 0.85
            --kv-cache-dtype fp8
            --block-size 64
            --trust-remote-code
            --host 0.0.0.0
            --port 8000
            --kv-transfer-config
              '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
      envFrom:
        - configMapRef:
            name: vllm-env
      resources:
        requests:
          memory: 1400Gi
        limits:
          amd.com/gpu: 8
          memory: 1400Gi  # 900 GB base + 256 GB LMCache CPU pool + headroom
      volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface/hub
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /models  # UPDATE: path to HuggingFace model cache on this node
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi

---
