      image: vllm/vllm-openai-rocm:nightly
      securityContext:
        privileged: true
      command: ["sh", "-c"]
      args:
        - exec vllm serve deepseek-ai/DeepSeek-V3.2
            --tensor-parallel-size 8
            --enable-prefix-caching
            --enable-expert-parallel
            --async-scheduling
            --max-model-len 65536
            --gpu-memory-utilization 0.85
            --kv-cache-dtype fp8
            --block-size 64
            --trust-remote-code
            --host 0.0.0.0
            --port 8000
      envFrom:
        - configMapRef:
            name: vllm-env
      resources:
