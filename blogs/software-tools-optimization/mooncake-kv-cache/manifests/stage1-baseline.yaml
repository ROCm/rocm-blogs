# Stage 1: Baseline — vLLM Router (consistent_hash) + 2 vLLM Instances
#
# DeepSeek-V3.2 (671B MoE, FP8) on 8×MI300X per node
# Router uses consistent_hash for session affinity (same user → same pod)
#
# Prerequisites:
#   1. Label GPU nodes: kubectl label node <node> gpu-node=node1 (and node2)
#   2. Model pre-downloaded at /models/deepseek-ai/DeepSeek-V3.2 on each GPU node
#   3. Adjust nodeSelector hostnames to match your cluster
#
# Apply:  kubectl apply -f stage1-baseline.yaml
# Test:   curl http://<any-node-ip>:30080/v1/models
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: vllm-serving

---
# ---------------------------------------------------------------------------
# RBAC — Router needs pod list/watch for K8s service discovery
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-router
  namespace: vllm-serving

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-router
  namespace: vllm-serving
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-router
  namespace: vllm-serving
subjects:
  - kind: ServiceAccount
    name: vllm-router
    namespace: vllm-serving
roleRef:
  kind: Role
  name: vllm-router
  apiGroup: rbac.authorization.k8s.io

---
# ---------------------------------------------------------------------------
# Router NodePort Service — external access at <any-node-ip>:30080
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: vllm-serving
spec:
  type: NodePort
  selector:
    app: vllm-router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
# ===========================================================================
# vLLM Router — consistent_hash with K8s service discovery
# Auto-discovers pods labeled app=vllm-worker in the vllm-serving namespace.
# ===========================================================================
apiVersion: v1
kind: Pod
metadata:
  name: router
  namespace: vllm-serving
  labels:
    app: vllm-router
spec:
  serviceAccountName: vllm-router
  restartPolicy: Always
  containers:
    - name: router
      image: vllm/vllm-router:latest
      command:
        - vllm-router
        - --host=0.0.0.0
        - --port=8080
        - --service-discovery
        - --selector
        - app=vllm-worker
        - --service-discovery-namespace=vllm-serving
        - --service-discovery-port=8000
        - --policy=consistent_hash
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10

---
# ===========================================================================
# Shared AMD environment variables
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-env
  namespace: vllm-serving
data:
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MLA: "1"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
  NCCL_MIN_NCHANNELS: "112"

---
# ===========================================================================
# vLLM Worker — Node 1 (8×MI300X, TP=8)
# ===========================================================================
apiVersion: v1
kind: Pod
metadata:
  name: vllm-node1
  namespace: vllm-serving
  labels:
    app: vllm-worker
spec:
  hostNetwork: true
  hostIPC: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: gpu-node-1  # UPDATE: your first GPU node hostname
  containers:
    - name: vllm
      image: vllm/vllm-openai-rocm:nightly
      securityContext:
        privileged: true
      command: ["sh", "-c"]
      args:
        - exec vllm serve deepseek-ai/DeepSeek-V3.2
            --tensor-parallel-size 8
            --enable-prefix-caching
            --enable-expert-parallel
            --async-scheduling
            --max-model-len 65536
            --gpu-memory-utilization 0.85
            --kv-cache-dtype fp8
            --block-size 64
            --trust-remote-code
            --host 0.0.0.0
            --port 8000
      envFrom:
        - configMapRef:
            name: vllm-env
      resources:
        requests:
          memory: 900Gi
        limits:
          amd.com/gpu: 8
          memory: 900Gi
      volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface/hub
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /models  # UPDATE: path to HuggingFace model cache on this node
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi

---
# ===========================================================================
# vLLM Worker — Node 2 (8×MI300X, TP=8)
# ===========================================================================
