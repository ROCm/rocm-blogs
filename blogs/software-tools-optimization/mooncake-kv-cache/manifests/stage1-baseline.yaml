          memory: 900Gi
      volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface/hub
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /models  # UPDATE: path to HuggingFace model cache on this node
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi
