<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Infera request flow (dark), animated: each arrow lights up in sequence 1 to 6 with a uniform cyan glow; shorter arrows animate more slowly.">
  <title>Infera Figure 3 — Animated Request Flow (dark, uniform glow, speed-balanced)</title>

  <defs>
    <!-- userSpaceOnUse so the filter NEVER collapses on straight (zero-bbox) arrows -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1180" height="920">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" filterUnits="userSpaceOnUse" x="0" y="0" width="1180" height="920">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="dotShine" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#b9f6a5"/>
      <stop offset="100%" stop-color="#3fa524"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d0d9"/>
    </marker>
  </defs>

  <style>
    .teal   { stroke:#34d0d9; }
    .orange { stroke:#ff9838; }
    .red    { stroke:#ff5a5a; }
    .yellow { stroke:#f2c744; }
    .box    { fill:#050607; stroke-width:2; }
    .ico    { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .name   { fill:#f2f6f7; font-size:21px; }
    .sub    { fill:#9fb0b5; font-size:13px; }
    .cont   { fill:#e9eef0; font-size:15px; }
    .step   { fill:#e9eef0; font-size:15px; }
    .num    { fill:#34d0d9; font-weight:700; }
    .cap    { fill:#c3ccce; font-size:13px; }
    .wf     { fill:none; stroke:#34d0d9; stroke-width:2.2; }
    .wf5    { fill:none; stroke:#34d0d9; stroke-width:3.4; }
    .dY     { fill:none; stroke:#f2c744; stroke-width:1.8; stroke-dasharray:8 6; }
    .dT     { fill:none; stroke:#34d0d9; stroke-width:1.8; stroke-dasharray:8 6; }
    /* UNIFORM light-up: identical style + width 6 + glow on EVERY arrow */
    .hi     { fill:none; stroke:#9ff8ff; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; opacity:0; filter:url(#glowLg); }
  </style>

  <rect x="0" y="0" width="1180" height="920" fill="#000000"/>

  <!-- ================= CONTAINERS ================= -->
  <rect class="box orange" x="80"  y="300" width="310" height="372" rx="12"/>
  <text class="cont" x="102" y="332">Prefill instances</text>
  <rect class="box red" x="790" y="300" width="310" height="372" rx="12"/>
  <text class="cont" x="812" y="332">Decode instances</text>
  <rect class="box teal" x="150" y="712" width="720" height="158" rx="12"/>
  <text x="180" y="758" fill="#34d0d9" font-size="19" font-weight="700">AMD Infinity</text>
  <text x="180" y="782" fill="#34d0d9" font-size="19" font-weight="700">Context (AIC)</text>

  <!-- ================= TOP NODES ================= -->
  <rect class="box teal" x="470" y="42" width="230" height="94" rx="12"/>
  <g class="ico teal" transform="translate(520,89)"><path d="M0,-15 L0,15 M-15,0 L15,0"/><path d="M0,-15 l-4,5 M0,-15 l4,5 M0,15 l-4,-5 M0,15 l4,-5 M-15,0 l5,-4 M-15,0 l5,4 M15,0 l-5,-4 M15,0 l-5,4"/></g>
  <text class="name" x="600" y="97" text-anchor="middle">Router</text>

  <rect class="box yellow" x="485" y="214" width="200" height="80" rx="12"/>
  <g class="ico yellow" transform="translate(528,254)"><circle cx="0" cy="-9" r="6"/><circle cx="-9" cy="8" r="6"/><circle cx="9" cy="8" r="6"/><path d="M0,-3 L-9,2 M0,-3 L9,2 M-3,8 L3,8"/></g>
  <text class="name" x="612" y="262" text-anchor="middle">ETCD</text>

  <!-- ================= PREFILL SUB-BOXES ================= -->
  <rect class="box orange" x="100" y="346" width="270" height="94" rx="9"/>
  <g class="ico orange" transform="translate(138,393)"><path d="M0,-13 L15,-6 L0,1 L-15,-6 Z"/><path d="M-15,0 L0,7 L15,0 M-15,6 L0,13 L15,6"/></g>
  <text class="name" x="178" y="388" font-size="18">Prefill Instances</text>
  <text class="sub" x="178" y="410">vllm / sglang / atom</text>

  <rect class="box teal" x="100" y="460" width="270" height="74" rx="9"/>
  <g class="ico teal" transform="translate(138,497)"><path d="M0,-13 L13,-6 L13,7 L0,14 L-13,7 L-13,-6 Z"/><path d="M0,-13 L0,0 M0,0 L13,-6 M0,0 L-13,-6"/></g>
  <text class="name" x="178" y="493" font-size="18">PD Connector</text>
  <text class="sub" x="178" y="513">mooncake / MoRI-IO</text>

  <rect class="box teal" x="100" y="554" width="270" height="74" rx="9"/>
  <g class="ico teal" transform="translate(138,591)"><circle cx="-6" cy="0" r="7"/><path d="M1,0 L14,0 M10,0 L10,7 M14,0 L14,6"/></g>
  <text class="name" x="178" y="597" font-size="18">KV Connector</text>

  <!-- ================= DECODE SUB-BOXES ================= -->
  <rect class="box red" x="810" y="346" width="270" height="94" rx="9"/>
  <g class="ico red" transform="translate(848,393)"><path d="M0,-13 L15,-6 L0,1 L-15,-6 Z"/><path d="M-15,0 L0,7 L15,0 M-15,6 L0,13 L15,6"/></g>
  <text class="name" x="888" y="388" font-size="18">Decode Instances</text>
  <text class="sub" x="888" y="410">vllm / sglang / atom</text>

  <rect class="box teal" x="810" y="460" width="270" height="74" rx="9"/>
  <g class="ico teal" transform="translate(848,497)"><path d="M0,-13 L13,-6 L13,7 L0,14 L-13,7 L-13,-6 Z"/><path d="M0,-13 L0,0 M0,0 L13,-6 M0,0 L-13,-6"/></g>
  <text class="name" x="888" y="493" font-size="18">PD Connector</text>
  <text class="sub" x="888" y="513">mooncake / MoRI-IO</text>

  <rect class="box teal" x="810" y="554" width="270" height="74" rx="9"/>
  <g class="ico teal" transform="translate(848,591)"><circle cx="-6" cy="0" r="7"/><path d="M1,0 L14,0 M10,0 L10,7 M14,0 L14,6"/></g>
  <text class="name" x="888" y="597" font-size="18">KV Connector</text>

  <!-- ================= KVD ================= -->
  <rect class="box teal" x="500" y="548" width="180" height="84" rx="12"/>
  <g class="ico teal" transform="translate(538,590)"><ellipse cx="0" cy="-10" rx="14" ry="5"/><path d="M-14,-10 L-14,10 a14,5 0 0 0 28,0 L14,-10"/><path d="M-14,0 a14,5 0 0 0 28,0"/></g>
  <text class="name" x="600" y="598" text-anchor="middle">KVD</text>

  <!-- ================= AIC CONTENTS ================= -->
  <g class="ico teal" transform="translate(445,785)"><ellipse cx="0" cy="-26" rx="34" ry="9"/><path d="M-34,-26 L-34,20 a34,9 0 0 0 68,0 L34,-26"/></g>
  <text class="name" x="445" y="795" text-anchor="middle" font-size="16">Local NVMe</text>
  <g class="ico teal" transform="translate(660,792)"><path d="M-46,14 a20,20 0 0 1 4,-40 a26,22 0 0 1 50,-4 a20,18 0 0 1 8,44 Z"/></g>
  <text class="name" x="662" y="798" text-anchor="middle" font-size="16">NFS over RDMA</text>

  <!-- ================= DASHED COMPONENT LINKS ================= -->
  <path class="dY" d="M560,294 L470,405"/>
  <text class="cap" x="470" y="428" text-anchor="middle">Register Prefill</text>
  <path class="dY" d="M612,294 L718,405"/>
  <text class="cap" x="718" y="428" text-anchor="middle">Register Decode</text>
  <path class="dT" d="M370,591 L500,590"/>
  <path class="dT" d="M680,590 L810,591"/>

  <!-- ================= WORKFLOW ARROWS (rest state) ================= -->
  <path id="p1" class="wf"  marker-end="url(#ah)" d="M470,89 L250,89 L250,300"/>
  <text class="step" x="258" y="80"><tspan class="num">1.</tspan> Input Request</text>

  <path id="p2" class="wf"  marker-end="url(#ah)" d="M585,136 L585,214"/>
  <text class="step" x="602" y="182"><tspan class="num">2.</tspan> Choose Pair of Prefill and Decode</text>

  <path id="p3" class="wf"  marker-end="url(#ah)" d="M370,591 L500,590"/>
  <text class="step" x="590" y="533" text-anchor="middle"><tspan class="num">3.</tspan> External KV Cache Query</text>

  <path id="p4" class="wf"  marker-end="url(#ah)" d="M258,712 L258,672"/>
  <text class="step" x="276" y="702"><tspan class="num">4.</tspan> Cache Hit, RDMA KV Cache Restore</text>

  <path id="p5" class="wf5" marker-end="url(#ah)" d="M370,497 L810,497"/>
  <text class="step" x="590" y="480" text-anchor="middle"><tspan class="num">5.</tspan> PD KV Transfer</text>

  <path id="p6" class="wf"  marker-end="url(#ah)" d="M980,300 L980,89 L700,89"/>
  <text class="step" x="760" y="80"><tspan class="num">6.</tspan> Continues Token Generation</text>

  <!-- ============================================================
       MASTER CLOCK (period 11.0s). Each stage begins at a fixed
       numeric offset; shorter arrows get LONGER durations so their
       dot moves + glows more slowly. Offsets = cumulative(dur+0.4 gap).
         s1 long  1.2  begin 0.0
         s2 short 1.6  begin 1.6
         s3 short 1.6  begin 3.6
         s4 short 1.6  begin 5.6
         s5 long  1.2  begin 7.6
         s6 long  1.2  begin 9.2   (ends 10.4; +0.6 -> loop 11.0)
       ============================================================ -->
  <rect x="-10" y="-10" width="1" height="1" fill="none" opacity="0">
    <animate id="clk" attributeName="x" begin="0s; clk.end" dur="11s" values="-10;-10"/>
  </rect>

  <!-- UNIFORM LIGHT-UP overlays (same style+width; dur per-arrow) -->
  <path class="hi" d="M470,89 L250,89 L250,300">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.2s" begin="clk.begin+0s"/>
  </path>
  <path class="hi" d="M585,136 L585,214">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.6s" begin="clk.begin+1.6s"/>
  </path>
  <path class="hi" d="M370,591 L500,590">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.6s" begin="clk.begin+3.6s"/>
  </path>
  <path class="hi" d="M258,712 L258,672">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.6s" begin="clk.begin+5.6s"/>
  </path>
  <path class="hi" d="M370,497 L810,497">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.2s" begin="clk.begin+7.6s"/>
  </path>
  <path class="hi" d="M980,300 L980,89 L700,89">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.72;1" dur="1.2s" begin="clk.begin+9.2s"/>
  </path>

  <!-- MOVING DOTS (same offsets + durations, so dot rides its arrow while it glows) -->
  <circle r="7" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="clk.begin+0s"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.2s" begin="clk.begin+0s"/>
  </circle>
  <circle r="7" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.6s" begin="clk.begin+1.6s"><mpath href="#p2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.6s" begin="clk.begin+1.6s"/>
  </circle>
  <circle r="7" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.6s" begin="clk.begin+3.6s"><mpath href="#p3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.6s" begin="clk.begin+3.6s"/>
  </circle>
  <circle r="7" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.6s" begin="clk.begin+5.6s"><mpath href="#p4"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.6s" begin="clk.begin+5.6s"/>
  </circle>
  <circle r="8" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="clk.begin+7.6s"><mpath href="#p5"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.2s" begin="clk.begin+7.6s"/>
  </circle>
  <circle r="7" fill="url(#dotShine)" filter="url(#glow)" opacity="0">
    <animateMotion dur="1.2s" begin="clk.begin+9.2s"><mpath href="#p6"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.9;1" dur="1.2s" begin="clk.begin+9.2s"/>
  </circle>

  <!-- ================= LEGEND ================= -->
  <path class="dY" d="M915,790 L965,790"/>
  <text class="cap" x="975" y="787">Connection between</text>
  <text class="cap" x="975" y="804">Infra Components</text>
  <path class="wf" marker-end="url(#ah)" d="M915,828 L963,828"/>
  <text class="cap" x="975" y="832">User Request work flow</text>
</svg>
