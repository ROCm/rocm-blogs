<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Infera capabilities with realistic hardware: KV-aware routing, prefill-decode disaggregation, and a KV-cache tier ladder of HBM, DDR memory, NVMe, and network.">
  <title>Infera capabilities v4a — realistic hardware, distinct memory devices</title>
  <defs>
    <radialGradient id="pT" cx="50%" cy="24%" r="95%"><stop offset="0" stop-color="#123a3f"/><stop offset="1" stop-color="#03070a"/></radialGradient>
    <radialGradient id="pO" cx="50%" cy="24%" r="95%"><stop offset="0" stop-color="#37200a"/><stop offset="1" stop-color="#070502"/></radialGradient>
    <radialGradient id="pG" cx="50%" cy="24%" r="95%"><stop offset="0" stop-color="#312808"/><stop offset="1" stop-color="#080702"/></radialGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/></filter>
    <filter id="dropS" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- ===== silicon / metal ===== -->
    <linearGradient id="chipBody" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#43535b"/><stop offset="0.5" stop-color="#212b33"/><stop offset="1" stop-color="#0b1015"/></linearGradient>
    <linearGradient id="chipTop" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#667c85"/><stop offset="1" stop-color="#2c3a42"/></linearGradient>
    <radialGradient id="chipCore" cx="42%" cy="36%" r="65%"><stop offset="0" stop-color="#c9fbff"/><stop offset="0.4" stop-color="#34d0d9"/><stop offset="1" stop-color="#0a4f55"/></radialGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5a2e"/><stop offset="1" stop-color="#06321a"/></linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#404b54"/><stop offset="0.5" stop-color="#232c34"/><stop offset="1" stop-color="#0e1318"/></linearGradient>
    <linearGradient id="srvHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63727d"/><stop offset="1" stop-color="#2b343c"/></linearGradient>

    <!-- ===== memory-tier device gradients (warm fade) ===== -->
    <linearGradient id="hbm" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fff1bf"/><stop offset="0.5" stop-color="#f2c744"/><stop offset="1" stop-color="#9c7620"/></linearGradient>
    <linearGradient id="dimm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e5a2f"/><stop offset="1" stop-color="#063018"/></linearGradient>
    <linearGradient id="dimmChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3138"/><stop offset="1" stop-color="#12161a"/></linearGradient>
    <linearGradient id="nvme" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3640"/><stop offset="1" stop-color="#141a20"/></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a444d"/><stop offset="1" stop-color="#161b21"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8862a"/></linearGradient>
  </defs>
  <style>
    .metal{stroke:#0a0d10;stroke-width:1.4}
    .verb{font-size:14px;font-weight:800;letter-spacing:4px}
    .title{fill:#f4f8f9;font-size:26px;font-weight:800}
    .tier{fill:#e9dfb6;font-size:12px;font-weight:700}
  </style>
  <rect width="1200" height="600" fill="#000000"/>

  <!-- ============ PANEL 1 ROUTE ============ -->
  <rect x="44" y="96" width="352" height="408" rx="20" fill="url(#pT)" stroke="#34d0d9" stroke-width="2.5"/>
  <g transform="translate(220,232)" filter="url(#drop)">
    <g stroke-linecap="round" filter="url(#glow)">
      <path d="M0,0 L96,-78" stroke="#1c6b70" stroke-width="6"/><path d="M0,0 L96,-78" stroke="#5ef2ff" stroke-width="2"/>
      <path d="M0,0 L110,-26" stroke="#1c6b70" stroke-width="6"/><path d="M0,0 L110,-26" stroke="#5ef2ff" stroke-width="2"/>
      <path d="M0,0 L110,26" stroke="#1c6b70" stroke-width="6"/><path d="M0,0 L110,26" stroke="#7dffb0" stroke-width="2.8"/>
      <path d="M0,0 L96,78" stroke="#1c6b70" stroke-width="6"/><path d="M0,0 L96,78" stroke="#5ef2ff" stroke-width="2"/>
    </g>
    <g class="metal">
      <rect x="88" y="-88" width="22" height="22" rx="4" fill="url(#chipTop)"/>
      <rect x="102" y="-38" width="22" height="22" rx="4" fill="url(#chipTop)"/>
      <rect x="100" y="14" width="28" height="28" rx="5" fill="url(#chipTop)" stroke="#b9f6a5" stroke-width="2.5"/>
      <rect x="88" y="66" width="22" height="22" rx="4" fill="url(#chipTop)"/>
    </g>
    <g class="metal">
      <rect x="-42" y="-42" width="84" height="84" rx="11" fill="url(#chipBody)"/>
      <rect x="-32" y="-32" width="64" height="64" rx="6" fill="url(#chipTop)"/>
      <circle cx="0" cy="0" r="21" fill="url(#chipCore)"/>
      <ellipse cx="-6" cy="-8" rx="7" ry="5" fill="#ffffff" opacity="0.75"/>
      <g stroke="#93a6b0" stroke-width="2">
        <path d="M-42,-24 h-8 M-42,-8 h-8 M-42,8 h-8 M-42,24 h-8"/>
        <path d="M42,-24 h8 M42,-8 h8 M42,8 h8 M42,24 h8"/>
        <path d="M-24,-42 v-8 M-8,-42 v-8 M8,-42 v-8 M24,-42 v-8"/>
        <path d="M-24,42 v8 M-8,42 v8 M8,42 v8 M24,42 v8"/>
      </g>
    </g>
  </g>
  <text class="verb" x="220" y="418" fill="#34d0d9" text-anchor="middle">ROUTE</text>
  <text class="title" x="220" y="456" text-anchor="middle">KV-Aware Routing</text>

  <!-- ============ PANEL 2 SPECIALIZE ============ -->
  <rect x="424" y="96" width="352" height="408" rx="20" fill="url(#pO)" stroke="#ff9838" stroke-width="2.5"/>
  <g transform="translate(600,232)" filter="url(#drop)">
    <g class="metal" transform="translate(-120,-48)">
      <rect x="0" y="0" width="98" height="96" rx="9" fill="url(#srv)"/>
      <rect x="0" y="0" width="98" height="22" rx="9" fill="url(#srvHi)"/>
      <g fill="#ff9838"><circle cx="14" cy="11" r="3"/><circle cx="26" cy="11" r="3" opacity=".55"/></g>
      <g stroke="#ff9838" stroke-width="3" opacity=".9"><path d="M14,40 h70 M14,56 h70 M14,72 h70 M14,88 h42"/></g>
      <rect x="4" y="4" width="30" height="3" rx="1.5" fill="#7f8f99" opacity=".5"/>
    </g>
    <g filter="url(#glow)">
      <path d="M-16,0 h32" stroke="#f2c744" stroke-width="7" stroke-linecap="round"/>
      <path d="M12,-10 L30,0 L12,10 Z" fill="#f2c744"/>
    </g>
    <text x="8" y="-16" fill="#ffe08a" font-size="12" font-weight="700" text-anchor="middle">KV</text>
    <g class="metal" transform="translate(30,-48)">
      <rect x="0" y="0" width="98" height="96" rx="9" fill="url(#srv)"/>
      <rect x="0" y="0" width="98" height="22" rx="9" fill="url(#srvHi)"/>
      <g fill="#ffcf7a"><circle cx="14" cy="11" r="3"/><circle cx="26" cy="11" r="3" opacity=".55"/></g>
      <g stroke="#ffcf7a" stroke-width="3"><path d="M16,84 v-14 M30,84 v-28 M44,84 v-42 M58,84 v-22 M72,84 v-34 M86,84 v-18"/></g>
      <rect x="4" y="4" width="30" height="3" rx="1.5" fill="#7f8f99" opacity=".5"/>
    </g>
  </g>
  <text class="verb" x="600" y="418" fill="#ff9838" text-anchor="middle">SPECIALIZE</text>
  <text class="title" x="600" y="456" text-anchor="middle">Prefill-Decode</text>
  <text class="title" x="600" y="488" text-anchor="middle">Disaggregation</text>

  <!-- ============ PANEL 3 RETAIN — REAL DISTINCT MEMORY DEVICES ============ -->
  <rect x="804" y="96" width="352" height="408" rx="20" fill="url(#pG)" stroke="#f2c744" stroke-width="2.5"/>

  <!-- warm data flow spine down the ladder -->
  <path d="M846,166 V372" stroke="#f2c744" stroke-width="2" opacity=".35" stroke-dasharray="2 6"/>

  <!-- TIER 1: HBM stack (on-package, hottest, glowing gold) -->
  <g transform="translate(872,150)" filter="url(#drop)">
    <g class="metal">
      <!-- base package -->
      <rect x="0" y="26" width="120" height="18" rx="3" fill="url(#chipBody)"/>
      <!-- stacked HBM dies -->
      <rect x="10" y="20" width="100" height="8" rx="1.5" fill="url(#hbm)"/>
      <rect x="10" y="13" width="100" height="8" rx="1.5" fill="url(#hbm)"/>
      <rect x="10" y="6"  width="100" height="8" rx="1.5" fill="url(#hbm)"/>
      <rect x="10" y="-1" width="100" height="8" rx="1.5" fill="url(#hbm)"/>
      <rect x="14" y="1" width="34" height="2" rx="1" fill="#fff6d8" opacity=".8"/>
    </g>
    <circle cx="132" cy="18" r="4" fill="#fff2c0" filter="url(#glow)"/>
    <text class="tier" x="150" y="16">HBM</text>
    <text x="150" y="32" fill="#b3a05f" font-size="10">on-GPU · hottest</text>
  </g>

  <!-- TIER 2: DDR DIMM stick -->
  <g transform="translate(890,214)" filter="url(#dropS)">
    <g class="metal">
      <rect x="0" y="6" width="150" height="34" rx="3" fill="url(#dimm)"/>
      <!-- memory chips -->
      <g fill="url(#dimmChip)" stroke="#0a0d10" stroke-width="0.8">
        <rect x="8" y="12" width="20" height="16" rx="1.5"/><rect x="32" y="12" width="20" height="16" rx="1.5"/>
        <rect x="56" y="12" width="20" height="16" rx="1.5"/><rect x="80" y="12" width="20" height="16" rx="1.5"/>
        <rect x="104" y="12" width="20" height="16" rx="1.5"/><rect x="128" y="12" width="14" height="16" rx="1.5"/>
      </g>
      <!-- gold contact fingers -->
      <g fill="url(#gold)"><rect x="6" y="40" width="4" height="6"/><rect x="14" y="40" width="4" height="6"/><rect x="22" y="40" width="4" height="6"/><rect x="30" y="40" width="4" height="6"/><rect x="38" y="40" width="4" height="6"/><rect x="46" y="40" width="4" height="6"/><rect x="54" y="40" width="4" height="6"/><rect x="62" y="40" width="4" height="6"/><rect x="70" y="40" width="4" height="6"/><rect x="78" y="40" width="4" height="6"/><rect x="86" y="40" width="4" height="6"/><rect x="94" y="40" width="4" height="6"/><rect x="102" y="40" width="4" height="6"/><rect x="110" y="40" width="4" height="6"/><rect x="118" y="40" width="4" height="6"/><rect x="126" y="40" width="4" height="6"/><rect x="134" y="40" width="4" height="6"/></g>
    </g>
    <text class="tier" x="162" y="30">Host RAM</text>
  </g>

  <!-- TIER 3: NVMe M.2 SSD -->
  <g transform="translate(908,278)" filter="url(#dropS)">
    <g class="metal">
      <rect x="0" y="8" width="150" height="26" rx="4" fill="url(#nvme)"/>
      <!-- controller + NAND packages -->
      <rect x="10" y="13" width="26" height="16" rx="2" fill="#1a2026" stroke="#0a0d10" stroke-width="0.8"/>
      <rect x="42" y="13" width="30" height="16" rx="2" fill="#141a20" stroke="#0a0d10" stroke-width="0.8"/>
      <rect x="78" y="13" width="30" height="16" rx="2" fill="#141a20" stroke="#0a0d10" stroke-width="0.8"/>
      <text x="25" y="24" fill="#8aa0ac" font-size="7" text-anchor="middle" font-weight="700">CTRL</text>
      <!-- M.2 notch + contacts -->
      <rect x="150" y="14" width="10" height="14" rx="2" fill="url(#gold)"/>
      <rect x="6" y="10" width="26" height="2" rx="1" fill="#5b6b76" opacity=".6"/>
    </g>
    <text class="tier" x="172" y="26">Local NVMe</text>
  </g>

  <!-- TIER 4: Network switch (coolest) -->
  <g transform="translate(926,338)" filter="url(#dropS)">
    <g class="metal">
      <rect x="0" y="6" width="150" height="30" rx="4" fill="url(#sw)"/>
      <rect x="0" y="6" width="150" height="8" rx="4" fill="#4a555e"/>
      <!-- SFP ports w/ green link LEDs -->
      <g><rect x="10" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="30" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="50" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="70" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="90" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="110" y="20" width="16" height="11" rx="1.5" fill="#0c1116"/><rect x="130" y="20" width="14" height="11" rx="1.5" fill="#0c1116"/></g>
      <g fill="#5effa0" filter="url(#glow)"><circle cx="14" cy="11" r="1.6"/><circle cx="34" cy="11" r="1.6"/><circle cx="54" cy="11" r="1.6"/><circle cx="74" cy="11" r="1.6"/></g>
    </g>
    <text class="tier" x="162" y="26">Network</text>
  </g>

  <!-- big warm-to-cool descending arrow -->
  <path d="M848,158 q-14,120 40,210" stroke="#f2c744" stroke-width="3.5" fill="none" stroke-dasharray="3 6" filter="url(#glow)"/>
  <path d="M884,362 l-9,10 l16,1 z" fill="#f2c744"/>

  <text class="verb" x="980" y="430" fill="#f2c744" text-anchor="middle">RETAIN</text>
  <text class="title" x="980" y="468" text-anchor="middle">KV-Cache Tiering</text>
</svg>
