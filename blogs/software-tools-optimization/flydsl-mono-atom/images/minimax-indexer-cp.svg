<svg xmlns="http://www.w3.org/2000/svg" width="760" height="722" viewBox="0 0 760 722" role="img" aria-labelledby="title desc">
  <title id="title">M3: context-parallel index selection</title>
  <desc id="desc">Four TP ranks score assigned parts of the index cache for all index heads, retain candidates, exchange them, and finish selection for each rank's own index head before sparse attention.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
  <rect width="760" height="722" rx="18" fill="#f8fafc"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="32" y="44" font-size="28" font-weight="700" fill="#172033" text-anchor="start">M3: context-parallel index selection</text>
    <text x="32" y="78" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">Work inside the FlyDSL mono path on TP4</text>
    <rect x="32" y="110" width="332" height="126" rx="12" fill="#ffffff" stroke="#145d80" stroke-width="2"/>
    <text x="52" y="142" font-size="23" font-weight="700" fill="#145d80" text-anchor="start">TP rank 0</text>
    <text x="52" y="176" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Score assigned cache blocks</text>
    <text x="52" y="208" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Keep top candidates per head</text>
    <rect x="396" y="110" width="332" height="126" rx="12" fill="#ffffff" stroke="#237f81" stroke-width="2"/>
    <text x="416" y="142" font-size="23" font-weight="700" fill="#237f81" text-anchor="start">TP rank 1</text>
    <text x="416" y="176" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Score assigned cache blocks</text>
    <text x="416" y="208" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Keep top candidates per head</text>
    <rect x="32" y="262" width="332" height="126" rx="12" fill="#ffffff" stroke="#a34f40" stroke-width="2"/>
    <text x="52" y="294" font-size="23" font-weight="700" fill="#a34f40" text-anchor="start">TP rank 2</text>
    <text x="52" y="328" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Score assigned cache blocks</text>
    <text x="52" y="360" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Keep top candidates per head</text>
    <rect x="396" y="262" width="332" height="126" rx="12" fill="#ffffff" stroke="#8567a8" stroke-width="2"/>
    <text x="416" y="294" font-size="23" font-weight="700" fill="#8567a8" text-anchor="start">TP rank 3</text>
    <text x="416" y="328" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Score assigned cache blocks</text>
    <text x="416" y="360" font-size="20" font-weight="400" fill="#172033" text-anchor="start">Keep top candidates per head</text>
    <path d="M380 402 V428" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="438" width="696" height="86" rx="12" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
    <text x="380" y="473" font-size="24" font-weight="700" fill="#172033" text-anchor="middle">Exchange top candidates across ranks</text>
    <text x="380" y="503" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">Use ready candidates from each part of the cache</text>
    <path d="M380 530 V552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="562" width="696" height="86" rx="12" fill="#f0f7fa" stroke="#145d80" stroke-width="2"/>
    <text x="380" y="597" font-size="24" font-weight="700" fill="#172033" text-anchor="middle">Select blocks for the rank's index head</text>
    <text x="380" y="627" font-size="21" font-weight="400" fill="#172033" text-anchor="middle">Pass the selected blocks to sparse attention</text>
    <text x="32" y="691" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">All ranks score all index heads over their assigned cache blocks.</text>
  </g>
</svg>
