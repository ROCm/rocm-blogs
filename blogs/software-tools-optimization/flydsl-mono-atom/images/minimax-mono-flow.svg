<svg xmlns="http://www.w3.org/2000/svg" width="760" height="914" viewBox="0 0 760 914" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax-M3: FlyDSL mono</title>
  <desc id="desc">Logical data flow in M3's sparse-layer FlyDSL mono computation, including matrix multiplications, index selection when needed, cache writes, and TP reductions. Blocks show groups of computations, not separate kernels.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
  <rect width="760" height="914" rx="18" fill="#f8fafc"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="32" y="44" font-size="29" font-weight="700" fill="#172033" text-anchor="start">MiniMax-M3: FlyDSL mono</text>
    <text x="32" y="78" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Fused projections, attention, and expert computation.</text>
    <rect x="32" y="110" width="696" height="88" rx="12" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
    <text x="54" y="144" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Normalize inputs and project Q/K/V</text>
    <text x="54" y="176" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Matrix multiplies: Q/K/V + index inputs where needed</text>
    <path d="M380 202 V224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="230" width="696" height="88" rx="12" fill="#f0f7fa" stroke="#145d80" stroke-width="2"/>
    <text x="54" y="264" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Prepare queries and caches</text>
    <text x="54" y="296" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Head normalization → RoPE → cache writes</text>
    <path d="M380 322 V344" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="350" width="696" height="114" rx="12" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
    <text x="54" y="384" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Select keys and compute attention</text>
    <text x="54" y="416" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Index scoring and selection when needed</text>
    <text x="54" y="444" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Sparse attention over the selected keys</text>
    <path d="M380 468 V490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="496" width="696" height="88" rx="12" fill="#f0f7fa" stroke="#145d80" stroke-width="2"/>
    <text x="54" y="530" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Project and combine attention outputs</text>
    <text x="54" y="562" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Output projection → TP reduction → residual</text>
    <path d="M380 588 V610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="616" width="696" height="114" rx="12" fill="#fff5f4" stroke="#e34b48" stroke-width="2"/>
    <text x="54" y="650" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Compute routed and shared experts</text>
    <text x="54" y="682" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Normalize inputs; select routed experts</text>
    <text x="54" y="710" font-size="21" font-weight="400" fill="#172033" text-anchor="start">Up/gate projection → activation → down projection</text>
    <path d="M380 734 V756" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="762" width="696" height="88" rx="12" fill="#f0f7fa" stroke="#145d80" stroke-width="2"/>
    <text x="54" y="796" font-size="24" font-weight="700" fill="#172033" text-anchor="start">Combine expert outputs</text>
    <text x="54" y="828" font-size="21" font-weight="400" fill="#172033" text-anchor="start">TP reduction → output for the next layer</text>
    <text x="32" y="890" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">Arrows show data flow. Independent tasks can overlap.</text>
  </g>
</svg>
