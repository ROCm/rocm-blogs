  <style>text{font-family:Inter,Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:850;fill:#152e7a}.sub{font-size:16px;fill:#4f5f7a}.h{font-size:16px;font-weight:760;fill:#111827}.label{font-size:14px;font-weight:740;fill:#1f2937}.m{font-size:13px;fill:#475569}.tiny{font-size:12px;fill:#64748b}.panel{fill:url(#panel);stroke:#d7e2f0;stroke-width:1.3;filter:url(#shadow)}.card{fill:#ffffff;stroke:#dbe7f4;stroke-width:1.2;filter:url(#soft)}.blue{fill:url(#blue);stroke:#4f7ee8}.yellow{fill:url(#yellow);stroke:#f08c00}.green{fill:url(#green);stroke:#18a878}.red{fill:url(#red);stroke:#e11d48}.purple{fill:url(#purple);stroke:#6d5bd0}.line{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.softline{stroke:#94a3b8;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.danger{font-size:16px;font-weight:760;fill:#be123c}.success{font-size:16px;font-weight:760;fill:#047857}</style>
</defs><rect width="1200" height="720" fill="url(#bg)"/><text class="title" x="600" y="48" text-anchor="middle">PrefillDelayer: Cross-DP Prefill Admission Gate</text><text class="sub" x="600" y="76" text-anchor="middle">Mixed prefillable status delays prefill; all-ready, timeout, or low-watermark allows it.</text><rect class="panel" x="45" y="112" width="535" height="555" rx="26"/><rect class="panel" x="620" y="112" width="535" height="555" rx="26"/><text class="h" x="85" y="150">Before: immediate solo prefill</text><text class="h" x="660" y="150">After: using delay prefill</text><text class="tiny" x="196" y="188" text-anchor="middle">rank A</text><text class="tiny" x="336" y="188" text-anchor="middle">rank B</text><text class="tiny" x="476" y="188" text-anchor="middle">rank C</text><text class="tiny" x="60" y="241">t0</text><text class="tiny" x="60" y="331">t1</text><text class="tiny" x="60" y="421">t2</text><rect class="yellow" x="140" y="210" width="112" height="50" rx="13"/><text class="label" x="196" y="233" text-anchor="middle">decode</text><text class="tiny" x="196" y="250" text-anchor="middle">31 batch</text><rect class="blue" x="280" y="210" width="112" height="50" rx="13"/><text class="label" x="336" y="233" text-anchor="middle">decode</text><text class="tiny" x="336" y="250" text-anchor="middle">33 batch</text><rect class="blue" x="420" y="210" width="112" height="50" rx="13"/><text class="label" x="476" y="233" text-anchor="middle">decode</text><text class="tiny" x="476" y="250" text-anchor="middle">33 batch</text><text class="tiny" x="54" y="292">new Request</text><path class="softline" d="M60 304 L130 318"/><rect class="yellow" x="140" y="300" width="112" height="50" rx="13"/><text class="label" x="196" y="323" text-anchor="middle">decode</text><text class="tiny" x="196" y="340" text-anchor="middle">30 batch</text><rect class="blue" x="280" y="300" width="112" height="50" rx="13"/><text class="label" x="336" y="323" text-anchor="middle">decode</text><text class="tiny" x="336" y="340" text-anchor="middle">32 batch</text><rect class="blue" x="420" y="300" width="112" height="50" rx="13"/><text class="label" x="476" y="323" text-anchor="middle">decode</text><text class="tiny" x="476" y="340" text-anchor="middle">32 batch</text><rect class="green" x="140" y="390" width="112" height="50" rx="13"/><text class="label" x="196" y="421" text-anchor="middle">prefill</text><rect class="red" x="280" y="390" width="112" height="50" rx="13"/><text class="label" x="336" y="413" text-anchor="middle">idle /</text><text class="label" x="336" y="430" text-anchor="middle">eager decode</text><rect class="red" x="420" y="390" width="112" height="50" rx="13"/><text class="label" x="476" y="413" text-anchor="middle">idle /</text><text class="label" x="476" y="430" text-anchor="middle">eager decode</text><rect class="red" x="156" y="468" width="334" height="58" rx="16"/><text class="danger" x="323" y="493" text-anchor="middle">rank A enters prefill alone</text><text class="m" x="323" y="515" text-anchor="middle">peers are not prefillable yet</text><rect class="card" x="156" y="565" width="334" height="45" rx="16"/><text class="m" x="323" y="593" text-anchor="middle">mixed phase -> padding or eager fallback</text><text class="tiny" x="768" y="188" text-anchor="middle">rank A</text><text class="tiny" x="908" y="188" text-anchor="middle">rank B</text><text class="tiny" x="1048" y="188" text-anchor="middle">rank C</text><text class="tiny" x="632" y="236">t0</text><text class="tiny" x="632" y="311">t1</text><text class="tiny" x="632" y="391">t2</text><text class="tiny" x="632" y="531">t3</text><rect class="yellow" x="712" y="205" width="112" height="50" rx="13"/><text class="label" x="768" y="228" text-anchor="middle">decode</text><text class="tiny" x="768" y="245" text-anchor="middle">31 batch</text><rect class="blue" x="852" y="205" width="112" height="50" rx="13"/><text class="label" x="908" y="228" text-anchor="middle">decode</text><text c