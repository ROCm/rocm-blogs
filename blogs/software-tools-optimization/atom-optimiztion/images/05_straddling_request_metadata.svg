<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="0.55" stop-color="#eef6ff"/><stop offset="1" stop-color="#fbf7ff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6fbff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10Z" fill="#64748b"/></marker>
  <style>text{font-family:Inter,Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:850;fill:#152e7a}.sub{font-size:16px;fill:#4f5f7a}.h{font-size:16px;font-weight:760;fill:#111827}.label{font-size:14px;font-weight:740;fill:#1f2937}.m{font-size:13px;fill:#475569}.tiny{font-size:12px;fill:#64748b}.panel{fill:url(#panel);stroke:#d7e2f0;stroke-width:1.3;filter:url(#shadow)}.card{fill:#ffffff;stroke:#dbe7f4;stroke-width:1.2;filter:url(#soft)}.blue{fill:url(#blue);stroke:#2563eb}.orange{fill:url(#orange);stroke:#ea580c}.green{fill:url(#green);stroke:#16a34a}.purple{fill:url(#purple);stroke:#7c3aed}.red{fill:url(#red);stroke:#e11d48}.line{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.mid{stroke:#be123c;stroke-width:5;stroke-dasharray:10 6}.note{font-size:16px;font-weight:760;fill:#0f766e}.bottomH{font-size:17px;font-weight:800;fill:#111827}.bottomM{font-size:13px;fill:#475569}</style>
</defs><rect width="1200" height="760" fill="url(#bg)"/><text class="title" x="600" y="52" text-anchor="middle">Token Split with Prefix / Chunked Prefill</text><text class="sub" x="600" y="80" text-anchor="middle">Token-midpoint TBO cuts a request, then serves the later half with the earlier half as prefix KV.</text><rect class="panel" x="70" y="120" width="1060" height="285" rx="26"/><text class="h" x="110" y="160">50 / 50 token-window split through one request</text><rect class="blue" x="140" y="220" width="310" height="58" rx="16"/><text class="label" x="295" y="254" text-anchor="middle">ub0 token window</text><rect class="purple" x="450" y="220" width="430" height="58" rx="16"/><text class="label" x="665" y="254" text-anchor="middle">straddled request</text><rect class="orange" x="880" y="220" width="210" height="58" rx="16"/><text class="label" x="985" y="254" text-anchor="middle">ub1 token window</text><line class="mid" x1="665" y1="183" x2="665" y2="330"/><text class="label" x="665" y="186" text-anchor="middle" fill="#be123c">MIDPOINT</text><text class="tiny" x="688" y="322">exact token cut</text><rect class="green" x="155" y="330" width="455" height="44" rx="14"/><text class="label" x="382" y="358" text-anchor="middle">ub0 writes prefix KV for the first half</text><path class="line" d="M620 352 L660 352"/><rect class="orange" x="670" y="330" width="420" height="44" rx="14"/><text class="label" x="880" y="358" text-anchor="middle">ub1 reads prefix KV, then extends</text><rect class="panel" x="70" y="448" width="345" height="165" rx="22"/><text class="bottomH" x="105" y="490">Token-window slices</text><text class="bottomM" x="105" y="528">token_slice = exact [start, end)</text><text class="bottomM" x="105" y="556">request_slice = overlapping requests</text><text class="bottomM" x="105" y="582">inside the token window.</text><rect class="panel" x="428" y="448" width="345" height="165" rx="22"/><text class="bottomH" x="463" y="490">Cached prefix / chunks</text><text class="bottomM" x="463" y="528">prefix_len = offset from request start.</text><text class="bottomM" x="463" y="556">Expose prefix as cached KV metadata.</text><rect class="panel" x="786" y="448" width="345" height="165" rx="22"/><text class="bottomH" x="821" y="490">Balanced execution</text><text class="bottomM" x="821" y="528">ub0 / ub1 split token totals.</text><text class="bottomM" x="821" y="556">DP sync reduces ubatch buffers.</text><text class="note" x="600" y="680" text-anchor="middle">Implementation idea: split by tokens for balance, then repair visibility by treating the earlier half as cached prefix.</text></svg>