<svg viewBox="0 0 780 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L10,5 L0,9z" fill="#64748b"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1020" fill="#0f172a"/>

  <!-- ====== ROW 1: Build Wheels ====== -->
  <rect x="230" y="20" width="320" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="46" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Build Wheels</text>
  <text x="390" y="68" text-anchor="middle" fill="#94a3b8" font-size="11">Compile LLVM &amp; MLIR · Generate .whl (py3.12/3.13)</text>

  <!-- Arrow down -->
  <line x1="390" y1="85" x2="390" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ====== ROW 2: Decision — Build OK? ====== -->
  <polygon points="390,130 510,180 390,230 270,180" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="176" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Build OK?</text>
  <text x="390" y="192" text-anchor="middle" fill="#fde68a" font-size="11">wheels exist</text>

  <!-- Yes arrow down -->
  <line x1="390" y1="230" x2="390" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="396" y="258" fill="#4ade80" font-size="11" font-weight="600">Yes</text>

  <!-- No arrow right -->
  <line x1="510" y1="180" x2="585" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="173" fill="#f87171" font-size="11" font-weight="600">No</text>

  <!-- Troubleshoot box (right) -->
  <rect x="590" y="148" width="170" height="65" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="675" y="168" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Troubleshoot Build</text>
  <text x="675" y="185" text-anchor="middle" fill="#fca5a5" font-size="10">• Check LLVM/MLIR deps</text>
  <text x="675" y="200" text-anchor="middle" fill="#fca5a5" font-size="10">• Verify CMake config</text>

  <!-- ====== ROW 3: Install in Validation Envs ====== -->
  <rect x="230" y="280" width="320" height="65" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="306" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Install in Validation Envs</text>
  <text x="390" y="328" text-anchor="middle" fill="#94a3b8" font-size="11">pip install flydsl*.whl  ·  per-GPU venv</text>

  <!-- Arrow down -->
  <line x1="390" y1="345" x2="390" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ====== ROW 4: Run Test Suites on GPU ====== -->
  <rect x="230" y="390" width="320" height="65" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="416" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Run Test Suites on GPU</text>
  <text x="390" y="438" text-anchor="middle" fill="#94a3b8" font-size="11">bash scripts/run_tests.sh  ·  functional + regression</text>

  <!-- GPU Runners annotation (left) -->
  <line x1="230" y1="422" x2="145" y2="422" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="15" y="392" width="130" height="62" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" filter="url(#sh)"/>
  <text x="80" y="411" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">⚡ GPU Runners</text>
  <text x="80" y="428" text-anchor="middle" fill="#fca5a5" font-size="9.5">MI300X (gfx942)</text>
  <text x="80" y="443" text-anchor="middle" fill="#fca5a5" font-size="9.5">MI350X (gfx950)</text>

  <!-- Arrow down -->
  <line x1="390" y1="455" x2="390" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ====== ROW 5: Decision — Tests Pass? ====== -->
  <polygon points="390,505 510,555 390,605 270,555" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="552" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Tests Pass?</text>
  <text x="390" y="568" text-anchor="middle" fill="#fde68a" font-size="11">all suites green</text>

  <!-- Yes arrow down -->
  <line x1="390" y1="605" x2="390" y2="650" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="396" y="635" fill="#4ade80" font-size="11" font-weight="600">Yes</text>

  <!-- No arrow right -->
  <line x1="510" y1="555" x2="585" y2="555" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="548" fill="#f87171" font-size="11" font-weight="600">No</text>

  <!-- Debug box (right) -->
  <rect x="590" y="523" width="170" height="65" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="675" y="543" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Debug Failures</text>
  <text x="675" y="560" text-anchor="middle" fill="#fca5a5" font-size="10">• Check PYTHONPATH</text>
  <text x="675" y="575" text-anchor="middle" fill="#fca5a5" font-size="10">• Verify MLIR .so loading</text>

  <!-- ====== ROW 6: Upload to AMD Index ====== -->
  <rect x="230" y="655" width="320" height="65" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="681" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Upload to AMD Package Index</text>
  <text x="390" y="703" text-anchor="middle" fill="#94a3b8" font-size="11">twine upload · signed artifacts</text>

  <!-- Arrow down -->
  <line x1="390" y1="720" x2="390" y2="765" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ====== ROW 7: Available via pip/uv ====== -->
  <rect x="230" y="770" width="320" height="65" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/>
  <text x="390" y="796" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Available via pip / uv</text>
  <text x="390" y="818" text-anchor="middle" fill="#94a3b8" font-size="11">pip install flydsl  ·  uv add flydsl</text>

  <!-- Arrow down -->
  <line x1="390" y1="835" x2="390" y2="880" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ====== ROW 8: Success ====== -->
  <rect x="270" y="885" width="240" height="60" rx="30" fill="#052e16" stroke="#22c55e" stroke-width="2.5" filter="url(#sh)"/>
  <text x="390" y="912" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="700">✅ Success!</text>
  <text x="390" y="932" text-anchor="middle" fill="#86efac" font-size="11">Nightly wheels published</text>

  <!-- ====== Stage Labels (left side) ====== -->
  <rect x="15" y="30" width="8" height="55" rx="4" fill="#3b82f6"/>
  <text x="32" y="63" fill="#60a5fa" font-size="10" font-weight="600" letter-spacing="1">BUILD</text>

  <rect x="15" y="290" width="8" height="165" rx="4" fill="#a855f7"/>
  <text x="32" y="378" fill="#c084fc" font-size="10" font-weight="600" letter-spacing="1">TEST</text>

  <rect x="15" y="665" width="8" height="170" rx="4" fill="#22c55e"/>
  <text x="32" y="755" fill="#4ade80" font-size="10" font-weight="600" letter-spacing="1">PUBLISH</text>

  <!-- ====== Footer ====== -->
  <text x="390" y="975" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">FlyDSL Nightly Pipeline  ·  Runs daily via CI/CD</text>
  <text x="390" y="995" text-anchor="middle" fill="#cbd5e1" font-size="11">GPU Targets: MI300X (gfx942) · MI350X (gfx950)  |  Python 3.12 / 3.13  |  Linux x86_64</text>
</svg>