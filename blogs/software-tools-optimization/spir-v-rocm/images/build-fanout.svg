<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ============= TOP PANEL: AOT-per-target ============= -->
  <rect x="20" y="20" width="1040" height="280" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" rx="6"/>

  <text x="40" y="50" font-size="16" font-weight="600" fill="#111827">Today: AOT-per-target</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">One device-codegen pass per --offload-arch; N native code objects per translation unit.</text>

  <!-- Source box -->
  <rect x="60" y="105" width="140" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="130" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">PyTorch / HIP</text>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#6b7280">source</text>

  <!-- Compiler stage -->
  <rect x="270" y="105" width="160" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="350" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">clang++ -x hip</text>
  <text x="350" y="155" text-anchor="middle" font-size="12" fill="#6b7280">--offload-arch=gfx900</text>
  <text x="350" y="172" text-anchor="middle" font-size="12" fill="#6b7280">... --offload-arch=gfx1201</text>

  <!-- Arrow source -> compiler -->
  <line x1="200" y1="145" x2="265" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Fan out to N targets -->
  <g stroke="#6b7280" stroke-width="1.3" fill="none">
    <path d="M 430,125 C 500,125 540,110 600,110" marker-end="url(#arrow-gray)"/>
    <path d="M 430,135 C 500,135 540,135 600,135" marker-end="url(#arrow-gray)"/>
    <path d="M 430,145 C 500,145 540,160 600,160" marker-end="url(#arrow-gray)"/>
    <path d="M 430,155 C 500,155 540,185 600,185" marker-end="url(#arrow-gray)"/>
    <path d="M 430,165 C 500,165 540,210 600,210" marker-end="url(#arrow-gray)"/>
    <path d="M 430,175 C 500,175 540,235 600,235" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- Stack of native code objects -->
  <g>
    <rect x="600" y="95" width="170" height="32" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="4"/>
    <text x="615" y="116" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">gfx900   .codeobj</text>

    <rect x="600" y="129" width="170" height="32" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="4"/>
    <text x="615" y="150" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">gfx90a   .codeobj</text>

    <rect x="600" y="163" width="170" height="32" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="4"/>
    <text x="615" y="184" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">gfx942   .codeobj</text>

    <rect x="600" y="197" width="170" height="32" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="4"/>
    <text x="615" y="218" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111827">gfx1100  .codeobj</text>

    <text x="685" y="247" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">... 15 in total</text>
  </g>

  <!-- Bracket label -->
  <path d="M 790,98 L 800,98 L 800,232 L 790,232" stroke="#374151" stroke-width="1.2" fill="none"/>
  <text x="815" y="160" font-size="13" font-weight="600" fill="#111827">fat binary</text>
  <text x="815" y="180" font-size="12" fill="#6b7280">~15× device codegen</text>
  <text x="815" y="196" font-size="12" fill="#6b7280">size grows linearly</text>
  <text x="815" y="212" font-size="12" fill="#6b7280">rebuild on new ASIC</text>

  <!-- ============= BOTTOM PANEL: SPIR-V flow ============= -->
  <rect x="20" y="340" width="1040" height="280" fill="#fef7f6" stroke="#fecaca" stroke-width="1" rx="6"/>

  <text x="40" y="370" font-size="16" font-weight="600" fill="#111827">With SPIR-V: one binary, runtime specialization</text>
  <text x="40" y="390" font-size="13" fill="#6b7280">A single device-codegen pass produces an abstract IR; the runtime lowers it to the actual GPU on first use.</text>

  <!-- Source box -->
  <rect x="60" y="425" width="140" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="130" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">PyTorch / HIP</text>
  <text x="130" y="480" text-anchor="middle" font-size="12" fill="#6b7280">source</text>

  <!-- Compiler stage -->
  <rect x="270" y="425" width="160" height="80" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="350" y="455" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">clang++ -x hip</text>
  <text x="350" y="475" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">--offload-arch=</text>
  <text x="350" y="492" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">amdgcnspirv</text>

  <line x1="200" y1="465" x2="265" y2="465" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Single SPIR-V binary -->
  <rect x="490" y="425" width="170" height="80" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="575" y="455" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">SPIR-V binary</text>
  <text x="575" y="475" text-anchor="middle" font-size="12" fill="#6b7280">portable, ~constant size</text>
  <text x="575" y="492" text-anchor="middle" font-size="12" fill="#6b7280">no gfx target baked in</text>

  <line x1="430" y1="465" x2="485" y2="465" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Build-time / Run-time divider -->
  <line x1="700" y1="350" x2="700" y2="610" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="685" y="358" text-anchor="end" font-size="11" fill="#6b7280" font-weight="600" letter-spacing="1">BUILD TIME</text>
  <text x="715" y="358" font-size="11" fill="#6b7280" font-weight="600" letter-spacing="1">RUN TIME (per device)</text>

  <!-- Arrow into runtime -->
  <line x1="660" y1="465" x2="730" y2="465" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Three devices, each with JIT -->
  <g>
    <rect x="740" y="395" width="290" height="50" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="6"/>
    <text x="755" y="416" font-size="12" font-weight="600" fill="#111827">gfx942 device</text>
    <text x="755" y="434" font-size="11" fill="#6b7280">SPIR-V → JIT → AMDGCN ISA (cached)</text>

    <rect x="740" y="455" width="290" height="50" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="6"/>
    <text x="755" y="476" font-size="12" font-weight="600" fill="#111827">gfx1201 device</text>
    <text x="755" y="494" font-size="11" fill="#6b7280">SPIR-V → JIT → AMDGCN ISA (cached)</text>

    <rect x="740" y="515" width="290" height="50" fill="#ffffff" stroke="#374151" stroke-width="1.2" rx="6"/>
    <text x="755" y="536" font-size="12" font-weight="600" fill="#111827">gfx-future device</text>
    <text x="755" y="554" font-size="11" fill="#6b7280">SPIR-V → JIT → AMDGCN ISA (no rebuild)</text>
  </g>

  <!-- Build-time divider on top panel too, for consistency -->
  <line x1="490" y1="30" x2="490" y2="290" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="475" y="42" text-anchor="end" font-size="11" fill="#6b7280" font-weight="600" letter-spacing="1">BUILD TIME</text>
  <text x="500" y="42" font-size="11" fill="#6b7280" font-weight="600" letter-spacing="1">RUN TIME</text>

  <!-- Bottom caption -->
  <text x="540" y="638" text-anchor="middle" font-size="17" fill="#4b5563" font-style="italic" font-family="sans-serif">Figure 1. The build-time fan-out today (top) versus the SPIR-V flow (bottom). Same source, very different artifact.</text>
</svg>
