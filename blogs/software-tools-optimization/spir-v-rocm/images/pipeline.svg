<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-gray2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">SPIR-V compilation pipeline in ROCm</text>
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="#6b7280">LLVM IR is target-specific from the front end onward; the portable artifact is the SPIR-V binary, not the IR.</text>

  <!-- Build-time region -->
  <rect x="20" y="80" width="700" height="440" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" rx="6"/>
  <text x="40" y="105" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="1.5">BUILD TIME</text>

  <!-- Runtime region -->
  <rect x="740" y="80" width="320" height="440" fill="#fef7f6" stroke="#fecaca" stroke-width="1" rx="6"/>
  <text x="760" y="105" font-size="12" font-weight="600" fill="#b91c1c" letter-spacing="1.5">RUN TIME (per device)</text>

  <!-- Stage 1: source -->
  <rect x="60" y="135" width="280" height="62" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="200" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">PyTorch / HIP / OpenCL source</text>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#6b7280">.cpp / .hip / .cl</text>

  <!-- Arrow -->
  <line x1="200" y1="197" x2="200" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>

  <!-- Stage 2: front end -->
  <rect x="60" y="228" width="280" height="62" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="200" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Clang front end</text>
  <text x="200" y="273" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">target = amdgcnspirv</text>

  <!-- Arrow -->
  <line x1="200" y1="290" x2="200" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>

  <!-- Stage 3: LLVM IR -->
  <rect x="60" y="321" width="280" height="62" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="200" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">LLVM IR</text>
  <text x="200" y="366" text-anchor="middle" font-size="11" fill="#6b7280">in the SPIR-V triple (target-specific)</text>

  <!-- Arrow -->
  <line x1="200" y1="383" x2="200" y2="411" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>

  <!-- Stage 4: translator/backend -->
  <rect x="60" y="414" width="280" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="200" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">SPIRV-LLVM Translator</text>
  <text x="200" y="456" text-anchor="middle" font-size="11" fill="#6b7280">(production today)</text>
  <text x="200" y="478" text-anchor="middle" font-size="11" fill="#6b7280">in-tree LLVM SPIR-V backend (upcoming)</text>

  <!-- Arrow from translator to SPIR-V artifact (drawn before box so head sits on edge) -->
  <path d="M 340 454 L 378 454 L 378 259 L 400 259" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr-gray2)"/>

  <!-- Build artifact (row-aligned with Clang front end / JIT) -->
  <rect x="400" y="219" width="280" height="80" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" rx="6"/>
  <text x="540" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">AMDGCN-flavored SPIR-V</text>
  <text x="540" y="265" text-anchor="middle" font-size="11" fill="#6b7280">portable across the AMD GPU lineup</text>
  <text x="540" y="283" text-anchor="middle" font-size="11" fill="#6b7280">retains AMDGCN intrinsics &amp; inline asm</text>

  <!-- RUNTIME side (rows aligned with left pipeline: y=135, 228, 321, 414) -->
  <!-- Device discovery (↔ source) -->
  <rect x="780" y="135" width="240" height="62" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="900" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Device discovery</text>
  <text x="900" y="180" text-anchor="middle" font-size="11" fill="#6b7280">read gcnArchName at load</text>

  <!-- JIT lowering (↔ Clang front end) -->
  <rect x="780" y="228" width="240" height="62" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="900" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">JIT: SPIR-V → ISA</text>
  <text x="900" y="273" text-anchor="middle" font-size="11" fill="#6b7280">late-resolved feature predicates</text>

  <!-- Cache (↔ LLVM IR row) -->
  <rect x="780" y="321" width="240" height="62" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2" rx="6"/>
  <text x="900" y="346" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">~/.cache/comgr/</text>
  <text x="900" y="366" text-anchor="middle" font-size="10" fill="#9a3412">JIT result cached here</text>

  <!-- ISA (↔ translator row) -->
  <rect x="780" y="414" width="240" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="900" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">AMDGPU ISA</text>
  <text x="900" y="456" text-anchor="middle" font-size="11" fill="#6b7280">native code, this device only</text>

  <!-- Runtime arrows (same spacing as left column) -->
  <line x1="900" y1="197" x2="900" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <line x1="900" y1="290" x2="900" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <line x1="900" y1="383" x2="900" y2="411" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray2)"/>

  <!-- SPIR-V artifact → JIT (drawn last so arrowhead sits on box edge) -->
  <line x1="680" y1="259" x2="780" y2="259" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red2)"/>

  <!-- Caption -->
  <text x="540" y="548" text-anchor="middle" font-size="17" fill="#4b5563" font-style="italic" font-family="sans-serif">Figure 2. Build time vs run time. The same SPIR-V binary lowers to whichever AMDGCN ISA the device reports.</text>
</svg>
