<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">SGLang-ATOM model registration design</title>
  <desc id="desc">Dark architecture diagram showing upstream SGLang using its model registration mechanism to load ATOM model wrappers, dynamic EntryClass registration, ATOM execution, and ROCm execution on AMD Instinct GPUs.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="50%" stop-color="#091728"/>
      <stop offset="100%" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="48%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00d7ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="55%" cy="56%" r="54%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-16%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="neon" x="-18%" y="-30%" width="136%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d7ff" flood-opacity="0.48"/>
    </filter>
    <filter id="purpleNeon" x="-18%" y="-30%" width="136%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a78bfa" flood-opacity="0.42"/>
    </filter>
    <filter id="greenNeon" x="-18%" y="-30%" width="136%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#20d498" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ba3bd"/>
    </marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d7ff"/>
    </marker>
    <style>
      .title { font: 800 33px Arial, sans-serif; fill: #f6fbff; letter-spacing: -0.3px; }
      .subtitle { font: 17px Arial, sans-serif; fill: #9fb2c8; }
      .label { font: 800 12px Arial, sans-serif; fill: #7f95ad; letter-spacing: 0.6px; text-transform: uppercase; }
      .panel { fill: #0c1828; stroke: #26384e; stroke-width: 1.6; filter: url(#panelShadow); }
      .sglang { fill: #18172d; stroke: #a78bfa; stroke-width: 2; filter: url(#purpleNeon); }
      .atom { fill: #062334; stroke: #00d7ff; stroke-width: 2; filter: url(#neon); }
      .kernel { fill: #0c2b26; stroke: #20d498; stroke-width: 1.8; filter: url(#greenNeon); }
      .runtime { fill: #121b2a; stroke: #4a5d74; stroke-width: 1.5; filter: url(#panelShadow); }
      .code { fill: #0a1322; stroke: #35465c; stroke-width: 1.4; filter: url(#panelShadow); }
      .whiteHead { font: 800 18px Arial, sans-serif; fill: #eef6ff; }
      .cyanHead { font: 800 18px Arial, sans-serif; fill: #00d7ff; }
      .purpleHead { font: 800 18px Arial, sans-serif; fill: #c4b5fd; }
      .greenHead { font: 800 18px Arial, sans-serif; fill: #20d498; }
      .text { font: 14px Arial, sans-serif; fill: #c8d6e5; }
      .small { font: 12px Arial, sans-serif; fill: #9fb2c8; }
      .micro { font: 11px Arial, sans-serif; fill: #84a9bd; }
      .mono { font: 12px "Courier New", monospace; fill: #c8d6e5; }
      .monoCyan { font: 12px "Courier New", monospace; fill: #7de7ff; }
      .flow { stroke: #8ba3bd; stroke-width: 2.2; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .cyanFlow { stroke: #00d7ff; stroke-width: 2.4; fill: none; marker-end: url(#cyanArrow); stroke-linecap: round; stroke-linejoin: round; }
      .join { stroke: #8ba3bd; stroke-width: 2.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1180" height="680" fill="url(#pageBg)"/>
  <rect width="1180" height="680" fill="url(#cyanGlow)"/>
  <rect width="1180" height="680" fill="url(#purpleGlow)"/>

  <text class="title" x="590" y="44" text-anchor="middle">SGLang-ATOM Model Registration Design</text>
  <text class="subtitle" x="590" y="76" text-anchor="middle">Upstream SGLang registers ATOM wrappers through its model registry, then delegates ROCm-native execution to ATOM.</text>

  <rect class="code" x="175" y="108" width="830" height="74" rx="16"/>
  <text class="label" x="205" y="133">SGLang Model Registration</text>
  <text class="monoCyan" x="205" y="156">ModelRegistry imports atom.plugin.sglang.models</text>
  <text class="mono" x="205" y="174">registered wrappers route selected architectures to ATOM execution</text>

  <rect class="panel" x="70" y="220" width="1040" height="205" rx="20"/>
  <text class="label" x="100" y="248">SGLang Serving and Model Registry</text>

  <rect class="sglang" x="105" y="275" width="250" height="92" rx="16"/>
  <text class="purpleHead" x="230" y="309" text-anchor="middle">Upstream SGLang</text>
  <text class="small" x="230" y="332" text-anchor="middle">serving APIs and runtime flow</text>
  <text class="micro" x="230" y="350" text-anchor="middle">no source modification required</text>

  <rect class="sglang" x="465" y="275" width="250" height="92" rx="16"/>
  <text class="purpleHead" x="590" y="309" text-anchor="middle">ModelRegistry</text>
  <text class="small" x="590" y="332" text-anchor="middle">imports external package</text>
  <text class="micro" x="590" y="350" text-anchor="middle">register(..., overwrite=True)</text>

  <rect class="sglang" x="825" y="275" width="250" height="92" rx="16"/>
  <text class="purpleHead" x="950" y="309" text-anchor="middle">ATOM Wrappers</text>
  <text class="small" x="950" y="332" text-anchor="middle">atom.plugin.sglang.models</text>
  <text class="micro" x="950" y="350" text-anchor="middle">EntryClass discovery</text>

  <path class="cyanFlow" d="M355 321 L455 321"/>
  <path class="cyanFlow" d="M715 321 L815 321"/>
  <path class="flow" d="M590 182 L590 265"/>

  <rect class="panel" x="70" y="460" width="1040" height="170" rx="20"/>
  <text class="label" x="100" y="488">ATOM Wrapper and Execution Bridge</text>

  <rect class="atom" x="120" y="515" width="275" height="78" rx="16"/>
  <text class="cyanHead" x="257.5" y="544" text-anchor="middle">Dynamic Wrappers</text>
  <text class="small" x="257.5" y="566" text-anchor="middle">DeepseekV3ForCausalLM</text>
  <text class="small" x="257.5" y="584" text-anchor="middle">Qwen3MoeForCausalLM</text>

  <rect class="atom" x="455" y="515" width="275" height="78" rx="16"/>
  <text class="cyanHead" x="592.5" y="544" text-anchor="middle">Base Wrapper</text>
  <text class="small" x="592.5" y="566" text-anchor="middle">SGLang model interface</text>
  <text class="micro" x="592.5" y="584" text-anchor="middle">atom.prepare_model(..., engine="sglang")</text>

  <rect class="atom" x="790" y="515" width="275" height="78" rx="16"/>
  <text class="cyanHead" x="927.5" y="544" text-anchor="middle">ATOM Execution</text>
  <text class="small" x="927.5" y="566" text-anchor="middle">forward + weight loading</text>
  <text class="micro" x="927.5" y="584" text-anchor="middle">load_model_in_plugin_mode</text>

  <path class="cyanFlow" d="M950 367 L950 430 L257.5 430 L257.5 505"/>
  <path class="flow" d="M395 554 L445 554"/>
  <path class="flow" d="M730 554 L780 554"/>

</svg>
