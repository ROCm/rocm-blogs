<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">ATOMesh in the ROCm LLM inference stack</title>
  <desc id="desc">Dark architecture diagram showing ATOMesh as an inference gateway above ATOM, vLLM, and SGLang runners, connected to shared model operations, ROCm kernels, and AMD Instinct GPUs.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="50%" stop-color="#091728"/>
      <stop offset="100%" stop-color="#07101d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="48%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#00d7ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="52%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ff8a1f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-16%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="neon" x="-18%" y="-30%" width="136%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d7ff" flood-opacity="0.50"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ba3bd"/>
    </marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d7ff"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 800 35px Arial, sans-serif; fill: #f6fbff; letter-spacing: -0.3px; }
      .subtitle { font: 17px Arial, sans-serif; fill: #9fb2c8; }
      .label { font: 800 13px Arial, sans-serif; fill: #7f95ad; letter-spacing: 0.3px; text-transform: uppercase; }
      .panel { fill: #0c1828; stroke: #24364c; stroke-width: 1.4; filter: url(#panelShadow); }
      .pill { fill: #111b2b; stroke: #3b4b60; stroke-width: 1.4; filter: url(#panelShadow); }
      .cyan { fill: #062334; stroke: #00d7ff; stroke-width: 2; filter: url(#neon); }
      .atom { fill: #082538; stroke: #00d7ff; stroke-width: 2.2; filter: url(#neon); }
      .orange { fill: #2a1c10; stroke: #ff9d2e; stroke-width: 2; filter: url(#panelShadow); }
      .shared { fill: #072638; stroke: #00d7ff; stroke-width: 2.3; filter: url(#neon); }
      .green { fill: #0c2b26; stroke: #20d498; stroke-width: 2; filter: url(#panelShadow); }
      .kernel { fill: #121b2a; stroke: #435368; stroke-width: 1.5; filter: url(#panelShadow); }
      .gpu { fill: #121b2a; stroke: #4a5d74; stroke-width: 1.7; filter: url(#panelShadow); }
      .side { fill: #0e1a2a; stroke: #26384e; stroke-width: 1.3; filter: url(#panelShadow); }
      .text { font: 14px Arial, sans-serif; fill: #c8d6e5; }
      .small { font: 12px Arial, sans-serif; fill: #8fa4bb; }
      .micro { font: 10px Arial, sans-serif; fill: #84a9bd; }
      .cyanText { font: 800 16px Arial, sans-serif; fill: #00d7ff; }
      .cyanTextBig { font: 800 20px Arial, sans-serif; fill: #00d7ff; }
      .orangeText { font: 800 16px Arial, sans-serif; fill: #ffad45; }
      .whiteHead { font: 800 15px Arial, sans-serif; fill: #eef6ff; }
      .caption { font: 15px Arial, sans-serif; fill: #9fb2c8; }
      .flow { stroke: #8ba3bd; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .cyanFlow { stroke: #00d7ff; stroke-width: 2.2; fill: none; marker-end: url(#cyanArrow); stroke-linecap: round; }
      .join { stroke: #8ba3bd; stroke-width: 2; fill: none; stroke-linecap: round; }
      .dash { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#purpleArrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1180" height="760" fill="url(#pageBg)"/>
  <rect width="1180" height="760" fill="url(#cyanGlow)"/>
  <rect width="1180" height="760" fill="url(#orangeGlow)"/>

  <text class="title" x="590" y="44" text-anchor="middle">ROCm Distributed LLM Inference Stack</text>
  <text class="subtitle" x="590" y="76" text-anchor="middle">ATOMesh above model engines, bridging OpenAI-compatible requests to AMD-optimized execution.</text>

  <text class="label" x="92" y="145" text-anchor="middle">Application Layer</text>
  <text class="label" x="92" y="221" text-anchor="middle">
    <tspan x="92" dy="0">Orchestration</tspan>
    <tspan x="92" dy="16">Layer</tspan>
  </text>
  <text class="label" x="75" y="370" text-anchor="middle">
    <tspan x="75" dy="0">Engine /</tspan>
    <tspan x="75" dy="16">Framework Layer</tspan>
  </text>
  <text class="label" x="75" y="552" text-anchor="middle">
    <tspan x="75" dy="0">Kernel /</tspan>
    <tspan x="75" dy="16">Collective Layer</tspan>
  </text>
  <text class="label" x="75" y="670" text-anchor="middle">Hardware Layer</text>

  <rect class="pill" x="395" y="108" width="250" height="46" rx="23"/>
  <text class="whiteHead" x="520" y="136" text-anchor="middle">OpenAI-Compatible API</text>

  <rect class="cyan" x="210" y="194" width="620" height="64" rx="14"/>
  <text class="cyanTextBig" x="520" y="224" text-anchor="middle">ATOMesh Inference Gateway</text>
  <text class="small" x="520" y="246" text-anchor="middle">PD routing | cache-aware scheduling | worker lifecycle | reliability | scaling</text>

  <path class="flow" d="M520 154 L520 194"/>
  <text class="small" x="538" y="178">request ingress</text>

  <rect class="panel" x="155" y="288" width="730" height="74" rx="18"/>
  <rect class="pill" x="200" y="306" width="175" height="48" rx="20"/>
  <text class="text" x="287.5" y="335" text-anchor="middle">vLLM Scheduler</text>

  <rect class="atom" x="432.5" y="306" width="175" height="48" rx="20"/>
  <text class="cyanText" x="520" y="335" text-anchor="middle">ATOM Scheduler</text>

  <rect class="pill" x="665" y="306" width="175" height="48" rx="20"/>
  <text class="text" x="752.5" y="335" text-anchor="middle">SGLang Scheduler</text>

  <path class="cyanFlow" d="M287.5 258 L287.5 306"/>
  <path class="cyanFlow" d="M520 258 L520 306"/>
  <path class="cyanFlow" d="M752.5 258 L752.5 306"/>
  <rect x="585" y="268" width="150" height="22" rx="11" fill="#091728" opacity="0.92"/>
  <text class="small" x="660" y="283" text-anchor="middle">model backend routing</text>

  <rect class="panel" x="155" y="382" width="730" height="74" rx="18"/>
  <rect class="cyan" x="200" y="395" width="175" height="48" rx="16"/>
  <text class="cyanText" x="287.5" y="424" text-anchor="middle">vLLM Runner</text>

  <rect class="atom" x="432.5" y="395" width="175" height="48" rx="16"/>
  <text class="cyanText" x="520" y="418" text-anchor="middle">ATOM Runner</text>
  <text class="micro" x="520" y="435" text-anchor="middle">ATOM-backed path</text>

  <rect class="cyan" x="665" y="395" width="175" height="48" rx="16"/>
  <text class="cyanText" x="752.5" y="424" text-anchor="middle">SGLang Runner</text>

  <path class="flow" d="M287.5 354 L287.5 395"/>
  <path class="flow" d="M520 354 L520 395"/>
  <path class="flow" d="M752.5 354 L752.5 395"/>
  <path class="dash" d="M287.5 354 C330 366 382 390 432.5 413"/>
  <path class="dash" d="M752.5 354 C710 366 658 390 607.5 413"/>

  <path class="join" d="M287.5 443 L287.5 468"/>
  <path class="join" d="M520 443 L520 468"/>
  <path class="join" d="M752.5 443 L752.5 468"/>
  <path class="join" d="M287.5 468 L752.5 468"/>
  <path class="flow" d="M520 468 L520 512"/>
  <text class="small" x="542" y="496">kernel dispatch</text>

  <rect class="shared" x="155" y="512" width="730" height="92" rx="18"/>
  <rect class="green" x="205" y="530" width="185" height="56" rx="14"/>
  <text class="cyanText" x="297.5" y="555" text-anchor="middle">AITER</text>
  <text class="small" x="297.5" y="576" text-anchor="middle">GPU Kernels</text>
  <rect class="green" x="427.5" y="530" width="185" height="56" rx="14"/>
  <text class="cyanText" x="520" y="555" text-anchor="middle">MORI</text>
  <text class="small" x="520" y="576" text-anchor="middle">MoE All-to-All</text>
  <rect class="green" x="650" y="530" width="185" height="56" rx="14"/>
  <text class="cyanText" x="742.5" y="555" text-anchor="middle">RCCL</text>
  <text class="small" x="742.5" y="576" text-anchor="middle">Collectives</text>

  <rect class="shared" x="155" y="640" width="730" height="62" rx="18"/>
  <rect class="gpu" x="190" y="654" width="660" height="35" rx="15"/>
  <text class="whiteHead" x="520" y="677" text-anchor="middle">ROCm / AMD Instinct GPUs</text>
  <path class="flow" d="M287.5 586 L287.5 640"/>
  <path class="flow" d="M520 586 L520 640"/>
  <path class="flow" d="M752.5 586 L752.5 640"/>

  <rect class="side" x="905" y="187" width="250" height="78" rx="14"/>
  <text class="whiteHead" x="925" y="212">ATOMesh Responsibilities</text>
  <text class="small" x="925" y="235">Disaggregated serving and routing</text>
  <text class="small" x="925" y="256">KV-aware scheduling and scaling</text>

  <rect class="side" x="905" y="296" width="250" height="58" rx="14"/>
  <text class="whiteHead" x="925" y="321">Backend Interfaces</text>
  <text class="small" x="925" y="344">ATOM, vLLM, SGLang backends</text>

  <rect class="side" x="905" y="377" width="250" height="84" rx="14"/>
  <text class="whiteHead" x="925" y="400">Model Execution</text>
  <text class="small" x="925" y="420">vLLM path or ATOM plugin path</text>
  <text class="small" x="925" y="438">SGLang path or ATOM plugin path</text>
  <text class="small" x="925" y="456">ROCm-native ATOM path</text>

  <rect class="side" x="905" y="528" width="250" height="60" rx="14"/>
  <text class="whiteHead" x="925" y="553">ROCm Runtime</text>
  <text class="small" x="925" y="576">Kernels and collectives</text>

  <rect class="side" x="905" y="628" width="250" height="70" rx="14"/>
  <text class="whiteHead" x="925" y="653">Hardware</text>
  <text class="small" x="925" y="676">MI300 / MI355 / MI400 series</text>

</svg>
