<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1285" viewBox="0 0 1400 1285" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax-M3 EAGLE3 optimized draft model execution path</title>
  <desc id="desc">Optimized MiniMax-M3 EAGLE3 draft model path. A token enters from the top, embedding is not sharded, attention runs with four-card tensor parallelism, then all-reduce, RMSNorm, quantization, MLP with four-card tensor parallelism followed by another all-reduce, and LM head GEMM split along the N dimension. The graph highlights fused RMSNorm and AR preparation, MTP decode preparation fusion, local argmax fusion, all-gather along the N dimension, and a final argmax to produce an output shape of M by 1.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .panel { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .title { fill: #24292f; font: 700 28px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #57606a; font: 15px Arial, Helvetica, sans-serif; }
      .section-title { fill: #24292f; font: 700 21px Arial, Helvetica, sans-serif; }
      .label { fill: #24292f; font: 700 16px Arial, Helvetica, sans-serif; }
      .small { fill: #57606a; font: 13px Arial, Helvetica, sans-serif; }
      .tiny { fill: #57606a; font: 12px Arial, Helvetica, sans-serif; }
      .code { fill: #24292f; font: 13px "DejaVu Sans Mono", Consolas, monospace; }
      .math { fill: #24292f; font: italic 17px Georgia, "Times New Roman", serif; }
      .blue { fill: #ddf4ff; stroke: #54aeef; stroke-width: 1.3; }
      .green { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.3; }
      .cream { fill: #fff4df; stroke: #d4a72c; stroke-width: 1.3; }
      .purple { fill: #fbefff; stroke: #bc8cff; stroke-width: 1.3; }
      .red { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.3; }
      .gray { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#small-arrowhead); }
      .strong-arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#small-arrowhead); }
      .thin-arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#small-arrowhead); }
      .tp-line { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
      .dash-green { fill: none; stroke: #2da44e; stroke-width: 1.6; stroke-dasharray: 6 5; }
      .dash-red { fill: none; stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 6 5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#24292f" />
    </marker>
    <marker id="small-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1285" rx="18" />
  <text class="title" x="700" y="45" text-anchor="middle">MiniMax-M3 EAGLE3 Optimized Draft Model</text>
  <text class="subtitle" x="700" y="74" text-anchor="middle">Token embedding is local; attention and MLP use 4-card TP; LM head GEMM is split along N with local argmax fusion</text>

  <!-- Legend -->
  <g transform="translate(390,102)">
    <rect class="blue" x="0" y="0" width="122" height="28" rx="7" />
    <text class="small" x="61" y="19" text-anchor="middle">local stage</text>
    <rect class="cream" x="150" y="0" width="122" height="28" rx="7" />
    <text class="small" x="211" y="19" text-anchor="middle">4-card TP</text>
    <rect class="purple" x="300" y="0" width="122" height="28" rx="7" />
    <text class="small" x="361" y="19" text-anchor="middle">collective</text>
    <rect class="green" x="450" y="0" width="122" height="28" rx="7" />
    <text class="small" x="511" y="19" text-anchor="middle">fused path</text>
  </g>

  <rect class="panel" x="120" y="150" width="1160" height="1115" rx="18" />
  <text class="section-title" x="700" y="188" text-anchor="middle">Optimized Draft Model Execution Path</text>

  <!-- Main vertical execution path -->
  <g transform="translate(290,210) scale(0.9)">
    <rect class="blue" x="300" y="0" width="220" height="58" rx="10" />
    <text class="label" x="410" y="23" text-anchor="middle">Input token</text>
    <text class="small" x="410" y="44" text-anchor="middle">generated by the draft loop</text>

    <path class="arrow" d="M410 58 V84" />
    <rect class="blue" x="270" y="84" width="280" height="56" rx="10" />
    <text class="label" x="410" y="106" text-anchor="middle">Embedding</text>
    <text class="small" x="410" y="126" text-anchor="middle">not sharded across tensor-parallel ranks</text>

    <path class="arrow" d="M410 140 V178" />

    <!-- EAGLE3 draft hidden-state fusion input -->
    <g transform="translate(-40,145)">
      <text class="math" x="0" y="25">h_low</text>
      <text class="math" x="0" y="65">h_mid</text>
      <text class="math" x="0" y="105">h_high</text>
      <path class="thin-arrow" d="M60 20 H98" />
      <path class="thin-arrow" d="M60 60 H98" />
      <path class="thin-arrow" d="M60 100 H98" />
      <rect class="dash-green" x="84" y="-2" width="66" height="124" rx="8" />
      <rect class="gray" x="100" y="8" width="38" height="26" rx="5" />
      <text class="tiny" x="119" y="26" text-anchor="middle">RMS</text>
      <rect class="gray" x="100" y="48" width="38" height="26" rx="5" />
      <text class="tiny" x="119" y="66" text-anchor="middle">RMS</text>
      <rect class="gray" x="100" y="88" width="38" height="26" rx="5" />
      <text class="tiny" x="119" y="106" text-anchor="middle">RMS</text>
      <path class="thin-arrow" d="M138 21 H178" />
      <path class="thin-arrow" d="M138 61 H178" />
      <path class="thin-arrow" d="M138 101 H178" />
      <path class="green" d="M180 -8 L242 26 L242 116 L180 150 Z" />
      <text class="label" x="211" y="75" text-anchor="middle">FC</text>
      <text class="tiny" x="118" y="140" text-anchor="middle">triple RMSNorm fusion</text>
    </g>

    <path class="thin-arrow" d="M202 216 H250" />
    <rect class="green" x="250" y="178" width="320" height="50" rx="10" />
    <text class="label" x="410" y="198" text-anchor="middle">Fused RMSNorm / Quant</text>
    <text class="small" x="410" y="216" text-anchor="middle">draft-side fused normalization and quantization</text>

    <path class="arrow" d="M410 228 V264" />
    <rect class="cream" x="210" y="264" width="400" height="70" rx="11" />
    <text class="label" x="410" y="288" text-anchor="middle">Attention</text>
    <text class="small" x="410" y="308" text-anchor="middle">4-card tensor parallel execution</text>
    <path class="tp-line" d="M310 264 V334 M410 264 V334 M510 264 V334" />
    <text class="tiny" x="235" y="352">GPU0</text>
    <text class="tiny" x="335" y="352">GPU1</text>
    <text class="tiny" x="435" y="352">GPU2</text>
    <text class="tiny" x="535" y="352">GPU3</text>

    <!-- Residual add after attention -->
    <path class="thin-arrow" d="M171 278 V344 Q171 372 199 372 H396" />
    <circle class="gray" cx="410" cy="372" r="14" />
    <text class="label" x="410" y="378" text-anchor="middle">+</text>
    <path class="strong-arrow" d="M410 334 V358" />
    <path class="strong-arrow" d="M410 386 V414" />
    <rect class="purple" x="290" y="414" width="240" height="48" rx="10" />
    <text class="label" x="410" y="444" text-anchor="middle">All-reduce</text>

    <path class="arrow" d="M410 462 V492" />
    <rect class="dash-green" x="236" y="492" width="348" height="76" rx="12" />
    <rect class="green" x="250" y="504" width="320" height="50" rx="10" />
    <text class="label" x="410" y="524" text-anchor="middle">Fused RMSNorm / Quant</text>
    <text class="small" x="410" y="542" text-anchor="middle">draft-side fused normalization and quantization</text>

    <path class="arrow" d="M410 554 V606" />
    <rect class="cream" x="210" y="606" width="400" height="70" rx="11" />
    <text class="label" x="410" y="634" text-anchor="middle">MLP</text>
    <text class="small" x="410" y="654" text-anchor="middle">4-card tensor parallel execution</text>
    <path class="tp-line" d="M310 606 V676 M410 606 V676 M510 606 V676" />

    <!-- Residual branch from the fused output into the post-MLP all-reduce -->
    <path class="thin-arrow" d="M410 578 H650 V734 H536" />
    <path class="arrow" d="M410 676 V710" />
    <rect class="purple" x="290" y="710" width="240" height="48" rx="10" />
    <text class="label" x="410" y="740" text-anchor="middle">All-reduce</text>

    <!-- Side branch for LM head -->
    <path class="strong-arrow" d="M530 734 H690" />
    <rect class="red" x="700" y="699" width="250" height="70" rx="11" />
    <text class="label" x="825" y="721" text-anchor="middle">LM Head</text>
    <text class="small" x="825" y="741" text-anchor="middle">GEMM M x K x N</text>
    <text class="small" x="825" y="761" text-anchor="middle">split along N across TP ranks</text>
    <path class="tp-line" d="M762 699 V769 M825 699 V769 M888 699 V769" />

    <path class="thin-arrow" d="M825 769 V791" />
    <rect class="green" x="684" y="797" width="282" height="62" rx="10" />
    <text class="label" x="825" y="821" text-anchor="middle">Per-rank local argmax</text>
    <text class="small" x="825" y="842" text-anchor="middle">argmax over M x (N/TP) along N/TP</text>

    <path class="thin-arrow" d="M825 859 V881" />
    <rect class="purple" x="700" y="887" width="250" height="42" rx="10" />
    <text class="label" x="825" y="913" text-anchor="middle">All-gather</text>

    <path class="thin-arrow" d="M825 929 V951" />
    <rect class="green" x="700" y="957" width="250" height="42" rx="10" />
    <text class="label" x="825" y="983" text-anchor="middle">Final argmax</text>

    <path class="thin-arrow" d="M825 999 V1021" />
    <rect class="blue" x="700" y="1027" width="250" height="58" rx="10" />
    <text class="label" x="825" y="1050" text-anchor="middle">Output candidates</text>
    <text class="small" x="825" y="1071" text-anchor="middle">shape: [M, 1]</text>

    <!-- Optimization callouts -->
    <rect class="dash-green" x="232" y="166" width="356" height="76" rx="12" />
    <text class="tiny" x="410" y="160" text-anchor="middle">RMSNorm + Quant fusion</text>

    <rect class="dash-green" x="188" y="592" width="444" height="196" rx="13" />
    <text class="tiny" x="410" y="802" text-anchor="middle">fused path around RMSNorm, Quant, MLP, and post-MLP all-reduce</text>

    <rect class="dash-green" x="670" y="685" width="312" height="414" rx="13" />
    <text class="tiny" x="826" y="1112" text-anchor="middle">all-gather along N, then final argmax produces the token output</text>
  </g>
</svg>
