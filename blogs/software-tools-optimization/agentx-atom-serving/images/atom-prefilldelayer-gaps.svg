<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="621" viewBox="0 0 800 414" role="img" aria-labelledby="atom-prefilldelayer-gaps-t atom-prefilldelayer-gaps-d">
<title id="atom-prefilldelayer-gaps-t">PrefillDelayer: hold arrivals, then prefill them together</title>
<desc id="atom-prefilldelayer-gaps-d">The same two arrivals, A and B, under two admission policies. Prefill on arrival runs two prefill passes; each pauses both decode streams, so 2 of 6 token gaps are long. PrefillDelayer keeps four decode passes after the previous prefill, holds A and B, then prefills them in one pass, so 1 of 6 gaps is long. Pass widths and gap counts are schematic.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif}</style>
<defs><marker id="atom-prefilldelayer-gaps-a" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="800" height="414" rx="16" fill="#f8fafc"/>
<text x="22" y="31" font-size="19" font-weight="600" text-anchor="start" fill="#111827">PrefillDelayer: hold arrivals, then prefill them together</text>
<text x="22" y="54" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Each prefill pass pauses every in-flight decode stream; those long token gaps set ITL P90.</text>
