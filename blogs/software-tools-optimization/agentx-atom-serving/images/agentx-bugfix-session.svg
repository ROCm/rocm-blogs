<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 800 428" role="img" aria-labelledby="agentx-bugfix-session-t agentx-bugfix-session-d">
<title id="agentx-bugfix-session-t">One coding session: every call re-sends a longer history</title>
<desc id="agentx-bugfix-session-d">Illustrative flow of one coding session from the public cc-traces-weka-062126 corpus. The parent agent makes model calls on the GPU and runs tools off the GPU. Under each call a bar shows the tokens it sends, to scale: call 2 sends 63.7K, call 3 sends 65.4K of which 63.7K is re-sent history, call 48 sends 195.5K of which 1.3K is new. After call 48 the session forks three sub-agents; two are drawn, each starting at 35.0K, and their last calls (the 7th and the 38th) send 69.1K and 113.5K. The parent waits, then call 49 sends 217.1K including 21.6K of returned results. Time is not to scale; call 1 (640 tokens) is not drawn. The corpus records token counts and timing, not what each call or tool did.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif}</style>
<defs><marker id="agentx-bugfix-session-a" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="800" height="428" rx="16" fill="#f8fafc"/>
