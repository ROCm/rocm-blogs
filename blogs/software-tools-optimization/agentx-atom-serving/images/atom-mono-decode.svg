<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 800 308" role="img" aria-labelledby="atom-mono-decode-t atom-mono-decode-d">
<title id="atom-mono-decode-t">Mono decode: one Kimi-K3 KDA layer in two ATOM kernels</title>
<desc id="atom-mono-decode-d">Before: one kernel per op in a KDA layer (AttnRes, in_proj, conv, KDA, norm, then o_proj, all-reduce, AttnRes, MoE, all-reduce), with each tensor-parallel all-reduce as a separate kernel. After: two persistent kernels, K1 kda_pre and K2 layer_post, with the all-reduce inside K2 and weights streamed from launch. Op boxes are schematic.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif}</style>
<defs><marker id="atom-mono-decode-a" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="800" height="308" rx="16" fill="#f8fafc"/>
<text x="22" y="31" font-size="19" font-weight="600" text-anchor="start" fill="#111827">Mono decode: one Kimi-K3 KDA layer in two ATOM kernels</text>
<text x="22" y="54" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Small-batch decode waits on launches and weight reads; fuse the layer, stream weights early.</text>
