<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="678" viewBox="0 0 800 452" role="img" aria-labelledby="atom-k3-cache-lifecycle-t atom-k3-cache-lifecycle-d">
<title id="atom-k3-cache-lifecycle-t">Kimi-K3 across two turns: save, find, restore, evict</title>
<desc id="atom-k3-cache-lifecycle-d">Request A saves a KDA checkpoint next to its prompt KV blocks in the shared PAGE pool; request B finds both, copies the checkpoint into its own state slot and prefills only the new tail.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif}</style>
<defs><marker id="atom-k3-cache-lifecycle-a" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="800" height="452" rx="16" fill="#f8fafc"/>
<text x="22" y="31" font-size="19" font-weight="600" text-anchor="start" fill="#111827">Kimi-K3 across two turns: save, find, restore, evict</text>
<text x="22" y="54" font-size="13" font-weight="400" text-anchor="start" fill="#475569">One session, two turns, per GPU · prompt-end checkpoints as in the recipe · logical view, not a memory layout</text>
<text x="164" y="86" font-size="12" font-weight="600" text-anchor="start" fill="#475569">TURN 1 · REQUEST A</text>
<text x="484" y="86" font-size="12" font-weight="600" text-anchor="start" fill="#475569">TURN 2 · REQUEST B</text>
<rect x="22" y="96" width="756" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="36" y="124" font-size="15" font-weight="600" text-anchor="start" fill="#246548">PAGE</text>
<text x="36" y="144" font-size="12" font-weight="400" text-anchor="start" fill="#475569">shared history,</text>
<text x="36" y="161" font-size="12" font-weight="400" text-anchor="start" fill="#475569">reference-counted</text>
<rect x="164" y="130" width="46" height="34" rx="8" fill="#daeee7" stroke="#cbd5e1" stroke-width="1"/>
<text x="187.0" y="151.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">KV</text>
<rect x="216" y="130" width="46" height="34" rx="8" fill="#daeee7" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.0" y="151.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">KV</text>
<rect x="268" y="130" width="46" height="34" rx="8" fill="#daeee7" stroke="#cbd5e1" stroke-width="1"/>
<text x="291.0" y="151.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">KV</text>
<text x="239" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">A&#x27;s prompt KV blocks</text>
<rect x="328" y="130" width="124" height="34" rx="8" fill="#e8e4f3" stroke="#cbd5e1" stroke-width="1"/>
<text x="390.0" y="151.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">KDA checkpoint</text>
<text x="484" y="118" font-size="14" font-weight="600" text-anchor="start" fill="#111827">② find: KV and checkpoint both hit</text>
<rect x="484" y="130" width="170" height="34" rx="8" fill="#daeee7" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="569" y="152" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">A&#x27;s prompt</text>
<rect x="662" y="130" width="104" height="34" rx="8" fill="#ffead5" stroke="#cbd5e1" stroke-width="1"/>
<text x="714.0" y="151.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">+ new tail</text>
<text x="569" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">same blocks, not copied</text>
<text x="714" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">prefill only this</text>
<rect x="22" y="290" width="756" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="36" y="318" font-size="15" font-weight="600" text-anchor="start" fill="#285F94">STATE</text>
<text x="36" y="338" font-size="12" font-weight="400" text-anchor="start" fill="#475569">private slot</text>
<text x="36" y="355" font-size="12" font-weight="400" text-anchor="start" fill="#475569">per request</text>
<rect x="164" y="306" width="288" height="34" rx="8" fill="#dbeaf4" stroke="#cbd5e1" stroke-width="1"/>
<text x="308.0" y="327.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">slot A · live KDA state</text>
<text x="308" y="362" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">A finishes: slot freed, checkpoint kept</text>
<rect x="484" y="306" width="282" height="34" rx="8" fill="#dbeaf4" stroke="#cbd5e1" stroke-width="1"/>
<text x="625.0" y="327.7" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">slot B · live KDA state</text>
<text x="625" y="362" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">continues from A&#x27;s checkpoint</text>
<line x1="468" y1="72" x2="468" y2="386" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M372 306V167" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#atom-k3-cache-lifecycle-a)"/>
<text x="364" y="252" font-size="14" font-weight="600" text-anchor="end" fill="#111827">① save: copy at prompt end</text>
<path d="M420 164V262H625V303" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#atom-k3-cache-lifecycle-a)"/>
<text x="484" y="254" font-size="14" font-weight="600" text-anchor="start" fill="#111827">③ restore: copy into slot B</text>
<rect x="22" y="402" width="756" height="34" rx="8" fill="#edf0f4" stroke="#edf0f4" stroke-width="1"/>
<text x="36" y="424" font-size="13" font-weight="400" text-anchor="start" fill="#111827">④ evict lazily: release only drops references; LRU reuses zero-reference blocks when PAGE is full</text>
</svg>
