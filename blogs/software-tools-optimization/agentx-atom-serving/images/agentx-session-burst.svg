<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="588" viewBox="0 0 800 392" role="img" aria-labelledby="agentx-session-burst-t agentx-session-burst-d">
<title id="agentx-session-burst-t">Fan-out makes load arrive in bursts</title>
<desc id="agentx-session-burst-d">One recorded session tree from the public cc-traces-weka-062126 corpus, first 372 seconds, drawn to scale. The parent agent forks four sub-agents and waits 118 seconds until the last one returns, then resumes 6 seconds later; its cache must stay resident until then. Sub-agent 3 returns last, 45 seconds after sub-agent 1. Request arrivals bunch up: 18 requests start within 63 seconds, while other calls are still generating, then no new request arrives for 83 seconds while a few long calls keep running. Times are as recorded against the original model API.</desc>
