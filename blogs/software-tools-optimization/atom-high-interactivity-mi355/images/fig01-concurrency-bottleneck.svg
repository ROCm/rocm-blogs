<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">High-interactivity decode changes the optimization target</title>
<desc id="desc">High-throughput prefill is compute-oriented while high-interactivity decode is overhead-oriented.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
  <style>
    .bg{fill:#fffaf0}.panel{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:20}.panel2{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:14}.shadow{fill:none;stroke:#c9bfae;stroke-width:1;opacity:.45}
    .title{font:800 30px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.subtitle{font:500 15px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.section{font:800 18px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .label{font:700 13px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.small{font:500 12px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.tiny{font:600 10px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#665f55}.stat{font:800 20px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.yellow{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:2;rx:12}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.4;rx:10}
    .arrow{stroke:#3f3f46;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 7}.thin{stroke-width:1.4}.line{stroke:#3f3f46;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}.hot{fill:#fce7f3;stroke:#db2777;stroke-width:2.4}.k0{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.k1{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.k2{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.k3{fill:#fce7f3;stroke:#db2777;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1500" height="600"/>
<text x="42" y="54" class="title"><tspan x="42" dy="0">High-interactivity decode changes the optimization target</tspan></text>
<text x="44" y="84" class="subtitle"><tspan x="44" dy="0">High throughput rewards arithmetic efficiency; high interactivity rewards fixed-cost removal.</tspan></text>
<rect class="panel" x="110" y="150" width="540" height="360" data-sketch="1"/>
<rect class="shadow" x="110.5" y="150.4" width="540" height="360" rx="12"/>
<text x="145" y="195" class="section"><tspan x="145" dy="0">High throughput / prefill</tspan></text>
<rect class="blue" x="170" y="250" width="150" height="70" data-sketch="1"/>
<rect class="shadow" x="170.5" y="250.4" width="150" height="70" rx="12"/>
<text x="245.0" y="282.0" class="label" text-anchor="middle"><tspan x="245.0" dy="0">Large</tspan><tspan x="245.0" dy="17">GEMMs</tspan></text>
<path class="arrow" d="M320 285 C355.0 285 355.0 285 390 285" data-sketch="1"/>
<rect class="green" x="390" y="250" width="170" height="70" data-sketch="1"/>
<rect class="shadow" x="390.5" y="250.4" width="170" height="70" rx="12"/>
<text x="475.0" y="282.0" class="label" text-anchor="middle"><tspan x="475.0" dy="0">Matrix engines</tspan><tspan x="475.0" dy="17">saturated</tspan></text>
<path class="arrow" d="M475 320 C475.0 320 475.0 385 475 385" data-sketch="1"/>
<rect class="yellow" x="340" y="385" width="270" height="78" data-sketch="1"/>
<rect class="shadow" x="340.5" y="385.4" width="270" height="78" rx="12"/>
<text x="475.0" y="421.0" class="label" text-anchor="middle"><tspan x="475.0" dy="0">Optimize arithmetic cost</tspan><tspan x="475.0" dy="17">low-bit math, larger tiles</tspan></text>
<rect class="panel" x="805" y="150" width="540" height="360" data-sketch="1"/>
<rect class="shadow" x="805.5" y="150.4" width="540" height="360" rx="12"/>
<text x="840" y="195" class="section"><tspan x="840" dy="0">High interactivity / decode</tspan></text>
<rect class="blue" x="860" y="245" width="165" height="70" data-sketch="1"/>
<rect class="shadow" x="860.5" y="245.4" width="165" height="70" rx="12"/>
<text x="942.5" y="277.0" class="label" text-anchor="middle"><tspan x="942.5" dy="0">Tiny per-token</tspan><tspan x="942.5" dy="17">steps</tspan></text>
<path class="arrow" d="M1025 280 C1060.0 280 1060.0 280 1095 280" data-sketch="1"/>
<rect class="red" x="1095" y="245" width="190" height="70" data-sketch="1"/>
<rect class="shadow" x="1095.5" y="245.4" width="190" height="70" rx="12"/>
<text x="1190.0" y="277.0" class="label" text-anchor="middle"><tspan x="1190.0" dy="0">Launches, memory</tspan><tspan x="1190.0" dy="17">trips, syncs</tspan></text>
<path class="arrow" d="M1190 315 C1190.0 315 1190.0 385 1190 385" data-sketch="1"/>
<rect class="green" x="1055" y="385" width="270" height="78" data-sketch="1"/>
<rect class="shadow" x="1055.5" y="385.4" width="270" height="78" rx="12"/>
<text x="1190.0" y="421.0" class="label" text-anchor="middle"><tspan x="1190.0" dy="0">Remove fixed overhead</tspan><tspan x="1190.0" dy="17">per generated token</tspan></text>
<text x="725" y="382" class="small" text-anchor="middle"><tspan x="725" dy="0">same model,</tspan><tspan x="725" dy="17">different bottleneck</tspan></text>
<path class="arrow" d="M610 410 C680.0 455 760.0 455 825 410" data-sketch="1"/>
</svg>
