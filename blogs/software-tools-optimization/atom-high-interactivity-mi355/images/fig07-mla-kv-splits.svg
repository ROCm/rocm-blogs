<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
<title id="title">Attention decode splits KV work to fill the wave</title>
<desc id="desc">MLA decode KV split selection based on batch size and sequence length.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
  <style>
    .bg{fill:#fffaf0}.panel{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:20}.panel2{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:14}.shadow{fill:none;stroke:#c9bfae;stroke-width:1;opacity:.45}
    .title{font:800 30px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.subtitle{font:500 15px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.section{font:800 18px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .label{font:700 13px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.small{font:500 12px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.tiny{font:600 10px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#665f55}.stat{font:800 20px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.yellow{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:2;rx:12}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.4;rx:10}
    .arrow{stroke:#3f3f46;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 7}.thin{stroke-width:1.4}.line{stroke:#3f3f46;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}.hot{fill:#fce7f3;stroke:#db2777;stroke-width:2.4}.k0{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.k1{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.k2{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.k3{fill:#fce7f3;stroke:#db2777;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1500" height="680"/>
<text x="42" y="54" class="title"><tspan x="42" dy="0">Attention decode splits KV work to fill the wave</tspan></text>
<text x="44" y="84" class="subtitle"><tspan x="44" dy="0">At high interactivity, long-context attention needs enough KV partitions to create parallel work.</tspan></text>
<rect class="panel" x="90" y="150" width="1310" height="470" data-sketch="1"/>
<rect class="shadow" x="90.5" y="150.4" width="1310" height="470" rx="12"/>
<text x="130" y="195" class="section"><tspan x="130" dy="0">MLA decode split selection</tspan></text>
<rect class="blue" x="190" y="300" width="190" height="90" data-sketch="1"/>
<rect class="shadow" x="190.5" y="300.4" width="190" height="90" rx="12"/>
<text x="285.0" y="350.0" class="label" text-anchor="middle"><tspan x="285.0" dy="0">Decode batch B</tspan></text>
<path class="arrow" d="M380 345 C437.5 345 437.5 345 495 345" data-sketch="1"/>
<rect class="yellow" x="495" y="285" width="230" height="120" data-sketch="1"/>
<rect class="shadow" x="495.5" y="285.4" width="230" height="120" rx="12"/>
<text x="610.0" y="342.0" class="label" text-anchor="middle"><tspan x="610.0" dy="0">Enough requests</tspan><tspan x="610.0" dy="17">to fill a wave?</tspan></text>
<path class="arrow" d="M725 315 C805.0 285 805.0 275 885 245" data-sketch="1"/>
<rect class="green" x="885" y="205" width="230" height="86" data-sketch="1"/>
<rect class="shadow" x="885.5" y="205.4" width="230" height="86" rx="12"/>
<text x="1000.0" y="245.0" class="label" text-anchor="middle"><tspan x="1000.0" dy="0">No: increase</tspan><tspan x="1000.0" dy="17">KV splits</tspan></text>
<path class="arrow" d="M1115 248 C1142.5 248 1142.5 248 1170 248" data-sketch="1"/>
<rect class="green" x="1170" y="205" width="170" height="86" data-sketch="1"/>
<rect class="shadow" x="1170.5" y="205.4" width="170" height="86" rx="12"/>
<text x="1255.0" y="245.0" class="label" text-anchor="middle"><tspan x="1255.0" dy="0">More</tspan><tspan x="1255.0" dy="17">workgroups</tspan></text>
<path class="arrow" d="M725 375 C805.0 405 805.0 445 885 475" data-sketch="1"/>
<rect class="purple" x="885" y="435" width="230" height="86" data-sketch="1"/>
<rect class="shadow" x="885.5" y="435.4" width="230" height="86" rx="12"/>
<text x="1000.0" y="475.0" class="label" text-anchor="middle"><tspan x="1000.0" dy="0">Yes: use</tspan><tspan x="1000.0" dy="17">fewer splits</tspan></text>
<path class="arrow" d="M1115 478 C1142.5 478 1142.5 478 1170 478" data-sketch="1"/>
<rect class="purple" x="1170" y="435" width="170" height="86" data-sketch="1"/>
<rect class="shadow" x="1170.5" y="435.4" width="170" height="86" rx="12"/>
<text x="1255.0" y="475.0" class="label" text-anchor="middle"><tspan x="1255.0" dy="0">Less</tspan><tspan x="1255.0" dy="17">merge work</tspan></text>
<rect class="muted" x="320" y="520" width="500" height="66" data-sketch="1"/>
<rect class="shadow" x="320.5" y="520.4" width="500" height="66" rx="12"/>
<text x="570.0" y="550.0" class="label" text-anchor="middle"><tspan x="570.0" dy="0">Split count is bounded by sequence length</tspan><tspan x="570.0" dy="17">short contexts avoid unnecessary partial work</tspan></text>
</svg>
