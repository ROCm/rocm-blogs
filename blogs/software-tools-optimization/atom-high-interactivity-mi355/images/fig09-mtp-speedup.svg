<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
<title id="title">MTP only helps when draft work is cheap and accepted</title>
<desc id="desc">Multi-token prediction flow and acceptance-rate dependency.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
  <style>
    .bg{fill:#fffaf0}.panel{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:20}.panel2{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:14}.shadow{fill:none;stroke:#c9bfae;stroke-width:1;opacity:.45}
    .title{font:800 30px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.subtitle{font:500 15px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.section{font:800 18px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .label{font:700 13px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.small{font:500 12px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.tiny{font:600 10px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#665f55}.stat{font:800 20px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.yellow{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:2;rx:12}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.4;rx:10}
    .arrow{stroke:#3f3f46;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 7}.thin{stroke-width:1.4}.line{stroke:#3f3f46;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}.hot{fill:#fce7f3;stroke:#db2777;stroke-width:2.4}.k0{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.k1{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.k2{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.k3{fill:#fce7f3;stroke:#db2777;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1500" height="680"/>
<text x="42" y="54" class="title"><tspan x="42" dy="0">MTP only helps when draft work is cheap and accepted</tspan></text>
<text x="44" y="84" class="subtitle"><tspan x="44" dy="0">Speculation lowers latency when multiple proposed tokens survive verification.</tspan></text>
<rect class="panel" x="90" y="150" width="1260" height="470" data-sketch="1"/>
<rect class="shadow" x="90.5" y="150.4" width="1260" height="470" rx="12"/>
<text x="130" y="195" class="section"><tspan x="130" dy="0">Multi-Token Prediction speedup condition</tspan></text>
<rect class="blue" x="170" y="315" width="190" height="80" data-sketch="1"/>
<rect class="shadow" x="170.5" y="315.4" width="190" height="80" rx="12"/>
<text x="265.0" y="352.0" class="label" text-anchor="middle"><tspan x="265.0" dy="0">Target model</tspan><tspan x="265.0" dy="17">state</tspan></text>
<path class="arrow" d="M360 355 C417.5 355 417.5 355 475 355" data-sketch="1"/>
<rect class="purple" x="475" y="315" width="190" height="80" data-sketch="1"/>
<rect class="shadow" x="475.5" y="315.4" width="190" height="80" rx="12"/>
<text x="570.0" y="352.0" class="label" text-anchor="middle"><tspan x="570.0" dy="0">Draft several</tspan><tspan x="570.0" dy="17">tokens</tspan></text>
<path class="arrow" d="M665 355 C722.5 355 722.5 355 780 355" data-sketch="1"/>
<rect class="yellow" x="780" y="315" width="190" height="80" data-sketch="1"/>
<rect class="shadow" x="780.5" y="315.4" width="190" height="80" rx="12"/>
<text x="875.0" y="352.0" class="label" text-anchor="middle"><tspan x="875.0" dy="0">Verify tokens</tspan><tspan x="875.0" dy="17">together</tspan></text>
<path class="arrow" d="M970 355 C1017.5 355 1017.5 355 1065 355" data-sketch="1"/>
<rect class="yellow" x="1065" y="295" width="160" height="120" data-sketch="1"/>
<rect class="shadow" x="1065.5" y="295.4" width="160" height="120" rx="12"/>
<text x="1145.0" y="360.0" class="label" text-anchor="middle"><tspan x="1145.0" dy="0">Accepted?</tspan></text>
<rect class="green" x="1030" y="185" width="230" height="70" data-sketch="1"/>
<rect class="shadow" x="1030.5" y="185.4" width="230" height="70" rx="12"/>
<text x="1145.0" y="217.0" class="label" text-anchor="middle"><tspan x="1145.0" dy="0">High acceptance</tspan><tspan x="1145.0" dy="17">more tokens per step</tspan></text>
<rect class="red" x="1030" y="455" width="230" height="70" data-sketch="1"/>
<rect class="shadow" x="1030.5" y="455.4" width="230" height="70" rx="12"/>
<text x="1145.0" y="487.0" class="label" text-anchor="middle"><tspan x="1145.0" dy="0">Low acceptance</tspan><tspan x="1145.0" dy="17">draft work wasted</tspan></text>
<path class="arrow" d="M1145 295 C1145.0 282 1145.0 268 1145 255" data-sketch="1"/>
<path class="arrow" d="M1145 415 C1145.0 428 1145.0 442 1145 455" data-sketch="1"/>
<rect class="green" x="360" y="520" width="470" height="62" data-sketch="1"/>
<rect class="shadow" x="360.5" y="520.4" width="470" height="62" rx="12"/>
<text x="595.0" y="556.0" class="label" text-anchor="middle"><tspan x="595.0" dy="0">MTP helps only when drafting is cheap and correct</tspan></text>
</svg>
