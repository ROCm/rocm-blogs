<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
<title id="title">Host overhead cleanup preserves graph replay</title>
<desc id="desc">CPU-GPU synchronization can break CUDA graph replay.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#334155"/></marker>
  <style>
    .bg{fill:#fffaf0}.panel{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:20}.panel2{fill:#fffdf7;stroke:#c9bfae;stroke-width:2;rx:14}.shadow{fill:none;stroke:#c9bfae;stroke-width:1;opacity:.45}
    .title{font:800 30px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.subtitle{font:500 15px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.section{font:800 18px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .label{font:700 13px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}.small{font:500 12px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#5f5a50}.tiny{font:600 10px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#665f55}.stat{font:800 20px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#1f2937}
    .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.yellow{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.red{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:2;rx:12}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.4;rx:10}
    .arrow{stroke:#3f3f46;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 7}.thin{stroke-width:1.4}.line{stroke:#3f3f46;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}.hot{fill:#fce7f3;stroke:#db2777;stroke-width:2.4}.k0{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.k1{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.k2{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.k3{fill:#fce7f3;stroke:#db2777;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1500" height="680"/>
<text x="42" y="54" class="title"><tspan x="42" dy="0">Host overhead cleanup preserves graph replay</tspan></text>
<text x="44" y="84" class="subtitle"><tspan x="44" dy="0">Removing synchronization avoids falling back to eager launches in the decode loop.</tspan></text>
<rect class="panel" x="90" y="145" width="1260" height="490" data-sketch="1"/>
<rect class="shadow" x="90.5" y="145.4" width="1260" height="490" rx="12"/>
<text x="130" y="190" class="section"><tspan x="130" dy="0">Graph-safe decode path</tspan></text>
<rect class="blue" x="190" y="300" width="170" height="80" data-sketch="1"/>
<rect class="shadow" x="190.5" y="300.4" width="170" height="80" rx="12"/>
<text x="275.0" y="345.0" class="label" text-anchor="middle"><tspan x="275.0" dy="0">Decode step</tspan></text>
<rect class="yellow" x="480" y="280" width="230" height="120" data-sketch="1"/>
<rect class="shadow" x="480.5" y="280.4" width="230" height="120" rx="12"/>
<text x="595.0" y="337.0" class="label" text-anchor="middle"><tspan x="595.0" dy="0">Any CPU-GPU</tspan><tspan x="595.0" dy="17">sync?</tspan></text>
<rect class="red" x="820" y="208" width="220" height="84" data-sketch="1"/>
<rect class="shadow" x="820.5" y="208.4" width="220" height="84" rx="12"/>
<text x="930.0" y="247.0" class="label" text-anchor="middle"><tspan x="930.0" dy="0">Yes</tspan><tspan x="930.0" dy="17">graph replay breaks</tspan></text>
<rect class="red" x="1070" y="208" width="190" height="84" data-sketch="1"/>
<rect class="shadow" x="1070.5" y="208.4" width="190" height="84" rx="12"/>
<text x="1165.0" y="247.0" class="label" text-anchor="middle"><tspan x="1165.0" dy="0">Eager</tspan><tspan x="1165.0" dy="17">launches</tspan></text>
<rect class="green" x="820" y="388" width="220" height="84" data-sketch="1"/>
<rect class="shadow" x="820.5" y="388.4" width="220" height="84" rx="12"/>
<text x="930.0" y="427.0" class="label" text-anchor="middle"><tspan x="930.0" dy="0">No</tspan><tspan x="930.0" dy="17">CUDA graph replay</tspan></text>
<rect class="green" x="1070" y="388" width="190" height="84" data-sketch="1"/>
<rect class="shadow" x="1070.5" y="388.4" width="190" height="84" rx="12"/>
<text x="1165.0" y="427.0" class="label" text-anchor="middle"><tspan x="1165.0" dy="0">Stable</tspan><tspan x="1165.0" dy="17">latency</tspan></text>
<rect class="green" x="300" y="530" width="520" height="62" data-sketch="1"/>
<rect class="shadow" x="300.5" y="530.4" width="520" height="62" rx="12"/>
<text x="560.0" y="566.0" class="label" text-anchor="middle"><tspan x="560.0" dy="0">Avoid .cpu() / .item(), cache metadata, reuse buffers</tspan></text>
<path class="arrow" d="M360 340 C420.0 340 420.0 340 480 340" data-sketch="1"/>
<path class="arrow" d="M710 310 C765.0 285 765.0 250 820 250" data-sketch="1"/>
<path class="arrow" d="M1040 250 C1055.0 250 1055.0 250 1070 250" data-sketch="1"/>
<path class="arrow" d="M710 370 C765.0 395 765.0 430 820 430" data-sketch="1"/>
<path class="arrow" d="M1040 430 C1055.0 430 1055.0 430 1070 430" data-sketch="1"/>
</svg>
