<title id="title">MI450 BF16 GEMM: the deferred-refill warp pipeline</title><desc id="desc">Four stages per tile, two wave groups one stage apart. Wave 0 alone performs cluster arrival and wait. Both groups execute TDM instructions, but only the leading group performs data transfers.</desc>
