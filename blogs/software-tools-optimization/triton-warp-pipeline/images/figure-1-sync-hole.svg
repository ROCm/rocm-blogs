<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Same work, different overlap</title><desc id="desc">Two schedules on the same time scale. In phase, Group A waits at s_barrier after its MFMA while Group B uses the shared matrix unit. One stage apart, memory preparation overlaps MFMA and matrix activity is continuous in this idealized steady state.</desc>
