<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mfma-title mfma-description">
  <title id="mfma-title">Conventional and operand-swapped MFMA workflows</title>
  <desc id="mfma-description">A side-by-side comparison showing that swapping the Q and K MFMA operands groups fused-attention score fragments by query, allowing the probability fragment to feed the P by V MFMA without an LDS transpose.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#172554"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#15803d"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #10275b; }
      .head { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172554; }
      .label { font-family: Arial, sans-serif; font-size: 16px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #475569; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: Georgia, serif; font-size: 18px; font-style: italic; fill: #172554; }
      .panel { fill: #fff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .cell { fill: #fff; stroke: #94a3b8; stroke-width: 1.1; }
      .q { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
      .k { fill: #ffedd5; stroke: #f97316; stroke-width: 1.8; }
      .p { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
      .v { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.8; }
      .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
      .blue { fill: #1d4ed8; }
      .orange { fill: #ea580c; }
      .green { fill: #15803d; }
      .purple { fill: #6d28d9; }
      .red { fill: #dc2626; }
      .mfma { fill: #10275b; stroke: #081a42; stroke-width: 2; rx: 10; }
      .mfmaText { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .code { font-family: Consolas, monospace; font-size: 12px; fill: #e0e7ff; text-anchor: middle; }
      .arrow { fill: none; stroke: #172554; stroke-width: 2; marker-end: url(#arrow); }
      .greenArrow { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#greenArrow); }
      .redArrow { fill: none; stroke: #dc2626; stroke-width: 2.5; marker-end: url(#redArrow); }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="#f8fafc"/>
  <rect class="panel" x="10" y="10" width="780" height="920"/>
  <rect class="panel" x="810" y="10" width="780" height="920"/>

  <!-- LEFT TITLE -->
  <text class="title" x="30" y="45">Conventional pack order: q_pack, k_pack</text>
  <text class="small" x="30" y="68">Toy active dimensions: 2 queries, 4 tokens, head dimension 3</text>

  <!-- LEFT Q -->
  <text class="head blue" x="35" y="105">Q [2x3]</text>
  <rect class="q" x="35" y="120" width="68" height="42"/><rect class="q" x="103" y="120" width="68" height="42"/><rect class="q" x="171" y="120" width="68" height="42"/>
  <rect class="cell" x="35" y="162" width="68" height="42"/><rect class="cell" x="103" y="162" width="68" height="42"/><rect class="cell" x="171" y="162" width="68" height="42"/>
  <text class="small blue" x="52" y="146">q00</text><text class="small blue" x="120" y="146">q01</text><text class="small blue" x="188" y="146">q02</text>
  <text class="small" x="52" y="188">q10</text><text class="small" x="120" y="188">q11</text><text class="small" x="188" y="188">q12</text>
  <text class="tiny" x="50" y="220">query rows</text>

  <!-- LEFT K -->
  <text class="head orange" x="290" y="105">K [4x3]</text>
  <rect class="k" x="290" y="120" width="62" height="32"/><rect class="k" x="352" y="120" width="62" height="32"/><rect class="k" x="414" y="120" width="62" height="32"/>
  <rect class="cell" x="290" y="152" width="62" height="32"/><rect class="cell" x="352" y="152" width="62" height="32"/><rect class="cell" x="414" y="152" width="62" height="32"/>
  <rect class="cell" x="290" y="184" width="62" height="32"/><rect class="cell" x="352" y="184" width="62" height="32"/><rect class="cell" x="414" y="184" width="62" height="32"/>
  <rect class="cell" x="290" y="216" width="62" height="32"/><rect class="cell" x="352" y="216" width="62" height="32"/><rect class="cell" x="414" y="216" width="62" height="32"/>
  <text class="tiny orange" x="305" y="141">k00</text><text class="tiny orange" x="367" y="141">k01</text><text class="tiny orange" x="429" y="141">k02</text>
  <text class="tiny" x="305" y="173">k10</text><text class="tiny" x="367" y="173">k11</text><text class="tiny" x="429" y="173">k12</text>
  <text class="tiny" x="305" y="205">k20</text><text class="tiny" x="367" y="205">k21</text><text class="tiny" x="429" y="205">k22</text>
  <text class="tiny" x="305" y="237">k30</text><text class="tiny" x="367" y="237">k31</text><text class="tiny" x="429" y="237">k32</text>
  <text class="tiny" x="495" y="141">token 0</text><text class="tiny" x="495" y="173">token 1</text>
  <text class="tiny" x="495" y="205">token 2</text><text class="tiny" x="495" y="237">token 3</text>

  <!-- LEFT MFMA -->
  <rect class="mfma" x="585" y="120" width="175" height="115"/>
  <text class="mfmaText" x="672" y="150">gfx942 MFMA</text>
  <text class="mfmaText" x="672" y="175">first Q, second K</text>
  <text class="code" x="672" y="203">mfma_acc(q_pack,</text>
  <text class="code" x="672" y="220">k_pack, acc)</text>
  <path class="arrow" d="M239 162 C390 275, 520 150, 582 160"/>
  <path class="arrow" d="M545 184 L582 184"/>

  <!-- LEFT SCORE EQUATION -->
  <rect x="30" y="265" width="730" height="70" fill="#fff" stroke="#2563eb" stroke-width="1.6" rx="8"/>
  <text class="math" x="55" y="293">S = QK<tspan baseline-shift="super" font-size="12">T</tspan>,   S[q,t] = <tspan font-size="27">&#x2211;</tspan><tspan baseline-shift="sub" font-size="10">h=0</tspan><tspan baseline-shift="super" font-size="10">2</tspan> Q[q,h] &#x00B7; K[t,h]</text>
  <text class="math" x="55" y="319">= Q[q,0] &#x00B7; K[t,0] + Q[q,1] &#x00B7; K[t,1] + Q[q,2] &#x00B7; K[t,2]</text>

  <g transform="translate(0 65)">
  <!-- LEFT TOKEN GROUPED OUTPUT -->
  <text class="head red" x="35" y="295">Output fragments are grouped by token</text>
  <text class="small" x="35" y="316">One fixed token; query index changes inside the fragment.</text>
  <text class="label red" x="35" y="355">token 0</text>
  <rect class="bad" x="110" y="330" width="92" height="48"/><rect class="bad" x="202" y="330" width="92" height="48"/>
  <text class="label" x="140" y="360">s00</text><text class="label" x="232" y="360">s10</text>
  <text class="label red" x="35" y="415">token 1</text>
  <rect class="bad" x="110" y="390" width="92" height="48"/><rect class="bad" x="202" y="390" width="92" height="48"/>
  <text class="label" x="140" y="420">s01</text><text class="label" x="232" y="420">s11</text>
  <text class="label red" x="335" y="355">token 2</text>
  <rect class="bad" x="410" y="330" width="92" height="48"/><rect class="bad" x="502" y="330" width="92" height="48"/>
  <text class="label" x="440" y="360">s02</text><text class="label" x="532" y="360">s12</text>
  <text class="label red" x="335" y="415">token 3</text>
  <rect class="bad" x="410" y="390" width="92" height="48"/><rect class="bad" x="502" y="390" width="92" height="48"/>
  <text class="label" x="440" y="420">s03</text><text class="label" x="532" y="420">s13</text>
  <text class="small red" x="620" y="355">query scores</text>
  <text class="small red" x="620" y="378">are split across</text>
  <text class="small red" x="620" y="401">four fragments</text>

  <!-- LEFT SOFTMAX AND TRANSPOSE -->
  <path class="redArrow" d="M380 450 L380 495"/>
  <text class="small red" x="400" y="480">softmax preserves this inconvenient grouping</text>
  <rect x="75" y="505" width="130" height="58" fill="#fff" stroke="#dc2626" stroke-width="2" rx="7"/>
  <text class="label red" x="98" y="530">write P to LDS</text><text class="small red" x="107" y="550">token-grouped</text>
  <rect x="260" y="495" width="120" height="78" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <line x1="300" y1="495" x2="300" y2="573" stroke="#cbd5e1"/><line x1="340" y1="495" x2="340" y2="573" stroke="#cbd5e1"/>
  <line x1="260" y1="521" x2="380" y2="521" stroke="#cbd5e1"/><line x1="260" y1="547" x2="380" y2="547" stroke="#cbd5e1"/>
  <text class="small red" x="280" y="592">transpose</text>
  <rect x="430" y="510" width="88" height="50" fill="#fff" stroke="#dc2626" stroke-width="2" rx="7"/>
  <text class="label red" x="447" y="540">barrier</text>
  <rect x="565" y="505" width="145" height="58" fill="#fff" stroke="#dc2626" stroke-width="2" rx="7"/>
  <text class="label red" x="585" y="530">read P from LDS</text><text class="small red" x="587" y="550">query-grouped</text>
  <path class="redArrow" d="M205 534 L257 534"/><path class="redArrow" d="M380 534 L427 534"/><path class="redArrow" d="M518 534 L562 534"/>

  <!-- LEFT PV -->
  <text class="head purple" x="35" y="650">P x V</text>
  <rect class="v" x="35" y="670" width="255" height="48"/>
  <text class="small purple" x="52" y="700">V^T fragment: [v0d, v1d, v2d, v3d]</text>
  <rect class="p" x="35" y="735" width="255" height="48"/>
  <text class="small green" x="52" y="765">P row: [p00, p01, p02, p03]</text>
  <rect class="mfma" x="360" y="685" width="180" height="85"/>
  <text class="mfmaText" x="450" y="717">PV MFMA</text><text class="code" x="450" y="744">mfma_acc(vt, p, acc)</text>
  <path class="arrow" d="M290 694 L357 710"/><path class="arrow" d="M290 759 L357 742"/>
  <text class="head purple" x="585" y="735">O = P x V</text>
  <path class="arrow" d="M540 727 L575 727"/>
  <rect x="120" y="805" width="555" height="42" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" rx="8"/>
  <text class="label red" x="155" y="832">Extra P LDS write + transpose + barrier + read</text>
  </g>

  <!-- RIGHT TITLE -->
  <text class="title" x="830" y="45">Operand-swapped pack order: k_pack, q_pack</text>
  <text class="small" x="830" y="68">Same Q, K, and attention scores; only register ownership changes</text>

  <!-- RIGHT K: visually first to match first MFMA operand -->
  <text class="head orange" x="835" y="105">K [4x3] - first operand</text>
  <rect class="k" x="835" y="120" width="62" height="32"/><rect class="k" x="897" y="120" width="62" height="32"/><rect class="k" x="959" y="120" width="62" height="32"/>
  <rect class="cell" x="835" y="152" width="62" height="32"/><rect class="cell" x="897" y="152" width="62" height="32"/><rect class="cell" x="959" y="152" width="62" height="32"/>
  <rect class="cell" x="835" y="184" width="62" height="32"/><rect class="cell" x="897" y="184" width="62" height="32"/><rect class="cell" x="959" y="184" width="62" height="32"/>
  <rect class="cell" x="835" y="216" width="62" height="32"/><rect class="cell" x="897" y="216" width="62" height="32"/><rect class="cell" x="959" y="216" width="62" height="32"/>
  <text class="tiny orange" x="850" y="141">k00</text><text class="tiny orange" x="912" y="141">k01</text><text class="tiny orange" x="974" y="141">k02</text>
  <text class="tiny" x="850" y="173">k10</text><text class="tiny" x="912" y="173">k11</text><text class="tiny" x="974" y="173">k12</text>
  <text class="tiny" x="850" y="205">k20</text><text class="tiny" x="912" y="205">k21</text><text class="tiny" x="974" y="205">k22</text>
  <text class="tiny" x="850" y="237">k30</text><text class="tiny" x="912" y="237">k31</text><text class="tiny" x="974" y="237">k32</text>

  <!-- RIGHT Q: visually second to match second MFMA operand -->
  <text class="head blue" x="1085" y="105">Q [2x3] - second operand</text>
  <rect class="q" x="1085" y="120" width="68" height="42"/><rect class="q" x="1153" y="120" width="68" height="42"/><rect class="q" x="1221" y="120" width="68" height="42"/>
  <rect class="cell" x="1085" y="162" width="68" height="42"/><rect class="cell" x="1153" y="162" width="68" height="42"/><rect class="cell" x="1221" y="162" width="68" height="42"/>
  <text class="small blue" x="1102" y="146">q00</text><text class="small blue" x="1170" y="146">q01</text><text class="small blue" x="1238" y="146">q02</text>
  <text class="small" x="1102" y="188">q10</text><text class="small" x="1170" y="188">q11</text><text class="small" x="1238" y="188">q12</text>

  <!-- RIGHT MFMA -->
  <rect class="mfma" x="1375" y="120" width="185" height="115"/>
  <text class="mfmaText" x="1467" y="150">gfx942 MFMA</text>
  <text class="mfmaText" x="1467" y="175">first K, second Q</text>
  <text class="code" x="1467" y="203">mfma_acc(k_pack,</text>
  <text class="code" x="1467" y="220">q_pack, acc)</text>
  <path class="arrow" d="M1021 184 C1150 280, 1300 150, 1372 160"/>
  <path class="arrow" d="M1289 184 L1372 184"/>

  <!-- RIGHT SCORE EQUATION -->
  <rect x="830" y="265" width="730" height="70" fill="#fff" stroke="#2563eb" stroke-width="1.6" rx="8"/>
  <text class="math" x="855" y="293">S = QK<tspan baseline-shift="super" font-size="12">T</tspan>,   S[q,t] = <tspan font-size="27">&#x2211;</tspan><tspan baseline-shift="sub" font-size="10">h=0</tspan><tspan baseline-shift="super" font-size="10">2</tspan> Q[q,h] &#x00B7; K[t,h]</text>
  <text class="math" x="855" y="319">= Q[q,0] &#x00B7; K[t,0] + Q[q,1] &#x00B7; K[t,1] + Q[q,2] &#x00B7; K[t,2]</text>

  <g transform="translate(0 65)">
  <!-- RIGHT QUERY GROUPED OUTPUT -->
  <text class="head green" x="835" y="295">Output fragments are grouped by query</text>
  <text class="small" x="835" y="316">One fixed query; all four token scores are already adjacent.</text>
  <text class="label blue" x="835" y="365">query 0</text>
  <rect class="p" x="920" y="337" width="112" height="52"/><rect class="p" x="1032" y="337" width="112" height="52"/>
  <rect class="p" x="1144" y="337" width="112" height="52"/><rect class="p" x="1256" y="337" width="112" height="52"/>
  <text class="label green" x="956" y="369">s00</text><text class="label green" x="1068" y="369">s01</text>
  <text class="label green" x="1180" y="369">s02</text><text class="label green" x="1292" y="369">s03</text>
  <text class="label" x="835" y="440">query 1</text>
  <rect class="p" x="920" y="412" width="112" height="52"/><rect class="p" x="1032" y="412" width="112" height="52"/>
  <rect class="p" x="1144" y="412" width="112" height="52"/><rect class="p" x="1256" y="412" width="112" height="52"/>
  <text class="label green" x="956" y="444">s10</text><text class="label green" x="1068" y="444">s11</text>
  <text class="label green" x="1180" y="444">s12</text><text class="label green" x="1292" y="444">s13</text>

  <!-- RIGHT SOFTMAX DIRECT -->
  <path class="greenArrow" d="M1144 478 L1144 525"/>
  <text class="small green" x="1165" y="505">softmax in registers; grouping unchanged</text>
  <rect class="p" x="920" y="535" width="448" height="58"/>
  <text class="label green" x="955" y="570">P query row: [p00, p01, p02, p03]</text>
  <text class="small green" x="1220" y="570">stays in VGPRs</text>

  <!-- RIGHT PV -->
  <text class="head purple" x="835" y="650">P x V</text>
  <rect class="v" x="835" y="670" width="300" height="48"/>
  <text class="small purple" x="852" y="700">V^T fragment: [v0d, v1d, v2d, v3d]</text>
  <rect class="p" x="835" y="735" width="300" height="48"/>
  <text class="small green" x="852" y="765">P fragment: [p00, p01, p02, p03]</text>
  <rect class="mfma" x="1205" y="685" width="190" height="85"/>
  <text class="mfmaText" x="1300" y="717">PV MFMA</text><text class="code" x="1300" y="744">mfma_acc(vt, p, acc)</text>
  <path class="greenArrow" d="M1135 694 L1202 710"/><path class="greenArrow" d="M1135 759 L1202 742"/>
  <text class="head purple" x="1435" y="735">O = P x V</text>
  <path class="arrow" d="M1395 727 L1425 727"/>
  <rect x="925" y="805" width="555" height="42" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" rx="8"/>
  <text class="label green" x="970" y="832">No P LDS transpose, no extra barrier, no extra LDS traffic</text>
  </g>

  <!-- FOOTNOTE -->
  <rect x="10" y="945" width="1580" height="58" fill="#fff" stroke="#64748b" stroke-width="1.5" rx="8"/>
  <text class="small" x="35" y="972">Attention math in both panels is identical: Q[2x3] x K^T[3x4] = S[2x4]. Only score ownership across MFMA lane fragments changes.</text>
  <text class="small" x="35" y="993">ISA semantics remain D = A * B + C. The toy active rows are padded into the real gfx942 MFMA tile.</text>
</svg>
